<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher | Inside Job</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Internal controls class game for District 214 Accounting: teams buy controls for a coffee cart, then see which fraud schemes they catch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2;--paper:#FFFFFF;--ink:#111111;--muted:#5C5C5C;--line:rgba(17,17,17,.14);--soft:#F4F4F4;--dark:#111111;
  --red:#C1102F;--good:#1E7A3C;--goodsoft:#E7F4EB;--bad:#C1102F;--badsoft:#FBE7EA;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:12px 18px 28px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;font-weight:600}
.top img{height:34px;width:auto;border-radius:3px;display:block}
.top a{color:inherit;text-decoration:none}
.sp{flex:1}
.pill{background:var(--dark);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.rejoin{background:var(--red);color:#fff;border:0;border-radius:999px;padding:7px 16px;font:700 16px var(--body)}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.5vw,72px);line-height:.98;margin:18px 0 6px}
h1.title span{color:var(--red)}
.lede{max-width:64ch;color:var(--muted);margin:0 0 18px}
.btn{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:700;font-size:17px}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--display);font-weight:600;font-size:24px;padding:10px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:620px;margin:10px auto 0}
.panel h2{font-family:var(--display);font-weight:600;font-size:32px;margin:0 0 6px}
.field{display:block;width:100%;font-size:26px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--soft);margin:6px 0 14px}
.field.code{letter-spacing:.3em;text-align:center;font-family:var(--display);font-size:40px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.note{font-size:15px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wait{text-align:center;padding:40px 10px}
.wait h2{font-family:var(--display);font-size:clamp(32px,6vw,54px);margin:0 0 8px;line-height:1.05}
.wait p{color:var(--muted);font-size:20px;max-width:40ch;margin:6px auto}
.big{font-family:var(--display);font-size:clamp(46px,10vw,90px);font-weight:700;line-height:1}

/* lobby */
.lobby{text-align:center}
.lobtop{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,60px);flex-wrap:wrap}
.lobleft{max-width:700px;flex:1 1 420px}
.lobby .join{font-size:clamp(20px,2.4vw,30px);color:var(--muted);font-weight:600}
.lobby .code{font-family:var(--display);font-weight:700;font-size:clamp(80px,14vw,170px);line-height:1;letter-spacing:.12em;margin:6px 0}
.lobby .url{font-weight:700;color:var(--muted);font-size:clamp(14px,1.4vw,20px);word-break:break-all}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);border:2px solid var(--line)}
.qr svg{width:clamp(180px,22vw,320px);height:auto;display:block}
.qr span{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#111;font-size:clamp(14px,1.4vw,20px)}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.names span{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--c,#111);border-radius:999px;padding:6px 16px;font-weight:700;font-size:22px}
.count{font-family:var(--display);font-size:24px;font-weight:600}

/* projector stage */
.rhead{display:flex;align-items:baseline;gap:14px;margin:6px 0 10px}
.rtag{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-size:22px}
.rname{font-family:var(--display);font-weight:600;font-size:22px;color:var(--muted)}
.scard{background:var(--paper);border:2px solid var(--line);border-left:12px solid var(--red);border-radius:14px;padding:18px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.stitle{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;margin:0 0 8px}
.story{font-size:27px;line-height:1.35;margin:0}
.stake{display:inline-block;margin-top:12px;background:var(--dark);color:#fff;border-radius:8px;padding:4px 14px;font-family:var(--display);font-weight:600;font-size:24px}
.lesson{margin-top:12px;background:var(--goodsoft);border-left:8px solid var(--good);border-radius:10px;padding:12px 18px;font-size:22px}
.lesson b{font-family:var(--display);font-weight:600;font-size:24px}
.ask{font-family:var(--display);font-size:28px;font-weight:600;margin:14px 0 4px;text-align:center}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;background:var(--paper);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:12px;padding:8px 12px 10px;min-height:96px}
.tile .tn{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.tile .rk{position:absolute;top:6px;right:10px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:18px}
.tile .cash{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .st{font-weight:700;font-size:16px;line-height:1.2}
.tile.ok{background:var(--goodsoft);border-color:var(--good);border-top-color:var(--c)}
.tile.no{background:var(--badsoft);border-color:var(--bad);border-top-color:var(--c)}
.tile .stamp{display:inline-block;border-radius:6px;padding:1px 8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;color:#fff;margin-right:6px}
.tile.ok .stamp{background:var(--good)} .tile.no .stamp{background:var(--bad)}
.tile.wait .st{color:var(--muted)} .tile.done .st{color:var(--good)}
.tile.anim{animation:tin .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d,0ms)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.attacks{display:grid;gap:8px;margin-top:10px}
.atk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:21px}
.atk.ok{background:var(--goodsoft);border-color:var(--good)} .atk.no{background:var(--badsoft);border-color:var(--bad)}
.atk b{font-family:var(--display);font-weight:600;font-size:23px}
.atk .res{font-family:var(--display);font-weight:700;font-size:24px;text-align:right;white-space:nowrap}
.atk.anim{animation:tin .45s both;animation-delay:var(--d,0ms)}

/* team device (iPad) */
.tbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:2px solid var(--line);margin-bottom:12px}
.meter{height:16px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--good);transition:width .25s}
.meter.full i{background:var(--red)}
.mtext{display:flex;justify-content:space-between;font-weight:700;font-size:20px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ctl{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:14px 16px;min-height:120px}
.ctl .cn{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ctl .cn b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1}
.ctl .cost{font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap}
.ctl .cd{color:var(--muted);font-size:17px}
.ctl[aria-pressed="true"]{border-color:var(--good);background:var(--goodsoft)}
.ctl[aria-pressed="true"] .cn b::before{content:"✓ ";color:var(--good)}
.ctl.owned{border-style:dashed;background:var(--soft);opacity:.75}
.ctl:disabled{opacity:.4}
.lock{position:sticky;bottom:0;background:var(--bg);padding:12px 0;margin-top:12px;border-top:2px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips span{background:var(--paper);border:2px solid var(--good);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
.verdict{border-radius:16px;padding:22px;text-align:center;margin:10px auto;max-width:720px}
.verdict.ok{background:var(--goodsoft);border:3px solid var(--good)} .verdict.no{background:var(--badsoft);border:3px solid var(--bad)}
.verdict h2{font-family:var(--display);font-size:clamp(40px,8vw,72px);margin:0;line-height:1}
.verdict.ok h2{color:var(--good)} .verdict.no h2{color:var(--bad)}
.verdict p{font-size:21px;margin:8px 0 0}
.mystory{background:var(--paper);border:2px solid var(--line);border-left:10px solid var(--red);border-radius:12px;padding:14px 18px;margin:8px auto;max-width:720px}
.mystory b{font-family:var(--display);font-weight:600;font-size:26px;display:block}
.mystory p{margin:6px 0 0;font-size:20px}
.cashline{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:12px;font-weight:700;font-size:20px}
.cashline b{font-family:var(--display);font-size:40px;display:block;line-height:1}
.scheme{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:14px 16px}
.scheme[aria-pressed="true"]{border-color:var(--red);background:var(--badsoft)}
.scheme .cn b{font-family:var(--display);font-weight:600;font-size:24px}
.target{background:var(--dark);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:12px}
.target b{font-family:var(--display);font-size:30px}
.target .chips span{background:#2b2b2b;border-color:#555;color:#fff}
.rep h2{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,54px);margin:6px 0;line-height:1.05}
.leak{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--bad);border-radius:12px;padding:10px 16px;margin:8px 0;font-size:18px}
.leak b{font-family:var(--display);font-weight:600;font-size:21px;display:block}
.leak.okk{border-left-color:var(--good)}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 1.2fr auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:19px}
.cr .b{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}.cr .b i{display:block;height:100%;background:var(--red)}
@media (max-width:760px){.shop{grid-template-columns:1fr}.atk{grid-template-columns:1fr}.atk .res{text-align:left}}
/* finale */
body.finale-on{overflow:hidden}
body.finale-on .top{visibility:hidden}
.finale{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 110%,#5a0614 0%,#1a0207 45%,#070707 100%);color:#fff;display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;padding:2.2vh 3vw 2vh;overflow:hidden}
.finale canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.finale .rays{position:absolute;left:50%;top:62%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 8deg,transparent 8deg 22deg);animation:spin 60s linear infinite;z-index:0;mask:radial-gradient(circle,#000 0%,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0%,transparent 55%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.fhead{position:relative;z-index:2;text-align:center}
.fhead .lg{height:clamp(34px,6vh,64px);display:block;margin:0 auto 1vh;border-radius:4px}
.fhead .kick{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;color:#FF4D63;font-size:clamp(14px,2.2vh,26px)}
.fhead h2{font-family:var(--display);font-weight:700;font-size:clamp(48px,10vh,130px);line-height:.95;margin:0;background:linear-gradient(180deg,#fff 45%,#F4B6C0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(193,16,47,.6))}
.podium{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:1.6vw;width:min(92vw,1500px);align-self:end}
.pod{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px) scale(.9);transition:opacity .5s, transform .7s cubic-bezier(.2,1.6,.4,1)}
.pod.in{opacity:1;transform:none}
.pod.empty{visibility:hidden}
.pod .who{text-align:center;margin-bottom:1.2vh;max-width:100%}
.pod .medal{width:clamp(44px,8vh,96px);height:clamp(44px,8vh,96px);border-radius:50%;display:grid;place-items:center;margin:0 auto .8vh;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vh,56px);color:#3b2600;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 24px rgba(0,0,0,.4)}
.p1 .medal{background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#C98A00)}
.p2 .medal{background:radial-gradient(circle at 35% 30%,#FFFFFF,#CFD6DD 55%,#8C98A3)}
.p3 .medal{background:radial-gradient(circle at 35% 30%,#FFD9B8,#D88B4A 55%,#8E4F1C);color:#2b1300}
.pod .nm{font-family:var(--display);font-weight:600;font-size:clamp(26px,5.4vh,72px);line-height:1.05;overflow-wrap:anywhere}
.p1 .nm{font-size:clamp(32px,7vh,96px);color:#fff;text-shadow:0 0 24px rgba(232,25,60,.8)}
.pod .pts{font-weight:700;font-size:clamp(18px,3.2vh,40px);opacity:.85}
.pod .block{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:1.4vh;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vh,80px);color:rgba(255,255,255,.92);background:linear-gradient(180deg,#E0213F,#8F0A20);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 -10px 40px rgba(193,16,47,.35)}
.p1 .block{height:26vh;background:linear-gradient(180deg,#F23A55,#A90C26)}
.p2 .block{height:18vh}
.p3 .block{height:13vh}
.p1.in .who{animation:pop 1.2s ease-out .2s 2}
@keyframes pop{50%{transform:scale(1.08)}}
.rest{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;width:min(92vw,1500px);margin-top:1.6vh}
.row45{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:1vh 1.4vw;font-size:clamp(20px,3.6vh,44px);font-weight:700;opacity:0;transform:translateX(-30px);transition:opacity .5s, transform .5s}
.row45.in{opacity:1;transform:none}
.row45 .r{font-family:var(--display);color:#FF4D63;min-width:1.4em}
.row45 .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row45 .s{opacity:.8}
.fbar{position:relative;z-index:4;display:flex;gap:10px;margin-top:1.6vh;opacity:.55;transition:opacity .2s}
.fbar:hover{opacity:1}
.fbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-size:15px;padding:6px 14px}
@media (max-width:700px){.rest{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.finale .rays{animation:none}.pod,.row45{transition:none}.p1.in .who{animation:none}}

/* student live: big answer buttons that fill the screen */
body.stu-live .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
body.stu-live #app{flex:1;display:flex;flex-direction:column}
body.stu-live .qwrap{flex:1;gap:10px}
body.stu-live .prompt{font-size:clamp(20px,2.6vh + 1vw,30px)}
body.stu-live .data{font-size:clamp(17px,2.2vh,24px)}
body.stu-live .opts{flex:1;grid-auto-rows:minmax(84px,1fr);gap:12px}
body.stu-live .opt{min-height:0;height:100%;font-size:clamp(20px,2.4vh + .6vw,30px);padding:14px 18px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
body.stu-live .opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
body.stu-live .opt .sh{width:48px;height:48px;font-size:26px}
@media (max-width:760px){body.stu-live .opts{grid-template-columns:1fr}}
.rejoin{margin-left:8px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:7px 16px;font:700 16px var(--body);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.big-rejoin{font-size:28px;padding:14px 34px}
.count .kick{display:block;font-size:.6em;color:var(--muted);font-family:var(--body);font-weight:600}


</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/logo-214.png" alt="District 214"><a href="/">District 214 Accounting</a> | <a href="/teacher">Teacher</a> | Chapter 6: Inside Job<span class="sp"></span><span class="pill" id="who" hidden></span><button class="rejoin" id="rejoin" hidden>↻ Rejoin</button></div>
  <main id="app"></main>
</div>

function mockNet(){
  const KEY="bankRecLiveMock",bc=("BroadcastChannel" in window)?new BroadcastChannel(KEY):null,subs=[];
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
  const write=t=>{localStorage.setItem(KEY,JSON.stringify(t));fire();if(bc)bc.postMessage(1)};
  const at=(t,p)=>p.split("/").filter(Boolean).reduce((o,k)=>o==null?undefined:o[k],t);
  const put=(t,p,v)=>{const ks=p.split("/").filter(Boolean);let o=t;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||o[k]===null)o[k]={};o=o[k]});if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v};

    kind:"mock",

    set:async(p,v)=>{const t=read();put(t,p,v);write(t)},

    remove:async p=>{const t=read();put(t,p,null);write(t)},

  };
}
async function vercelNet(){

function startFireworks(on){
  const cv=$("#fw");if(!cv)return;const cx=cv.getContext("2d");if(FW)cancelAnimationFrame(FW.raf);
  const dpr=Math.min(2,devicePixelRatio||1);const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr};size();addEventListener("resize",size);
  const COLS=["#C1102F","#E8193C","#FFFFFF","#FFFFFF","#D9D9D9","#C1102F"];
  const rockets=[],parts=[];const t0=performance.now();let last=t0;
  const launch=()=>{const W=cv.width,Hh=cv.height;rockets.push({x:W*(.12+Math.random()*.76),y:Hh,vx:(Math.random()-.5)*1.2*dpr,vy:-(Hh*.0125+Math.random()*Hh*.004),ty:Hh*(.12+Math.random()*.35),c:COLS[Math.floor(Math.random()*COLS.length)]})};
  const burst=(r)=>{const n=70+Math.floor(Math.random()*40),sp=(2.2+Math.random()*2.2)*dpr,ring=Math.random()<.35;
    for(let k=0;k<n;k++){const a=Math.PI*2*k/n+Math.random()*.1,v=ring?sp:sp*(.35+Math.random()*.75);parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.008+Math.random()*.01,c:Math.random()<.25?"#FFFFFF":r.c,s:(1.6+Math.random()*1.4)*dpr})}};
  FW={raf:0};
  const frame=(now)=>{if(!FW)return;const el=now-t0,dt=Math.min(40,now-last);last=now;
    const rate=el<7000?260:el<20000?900:1800; // busy at first, then a gentle show

    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.09*dpr;cx.fillStyle=r.c;cx.beginPath();cx.arc(r.x,r.y,2.2*dpr,0,7);cx.fill();if(r.y<=r.ty||r.vy>=0){burst(r);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.045*dpr;p.life-=p.d;if(p.life<=0){parts.splice(i,1);continue}

async function rejoin(){const N=await net().catch(()=>null);if(!N)return needSetup();
  if(ME){ME.key=null;try{const r=await ME.N.get(`games/${ME.code}/players/${ME.pid}`);if(r)ME.rec=r;const st=await ME.N.get(`games/${ME.code}/state`);if(st)ME.state=st}catch(e){}teamRender();return}
  const sv=loadSess();if(!sv)return joinForm();const err=await enterGame(N,sv.code,sv.name,sv.pid);if(err)joinForm()}
function shopHTML(kind){
  const M=ME,isUp=kind==="up",sel=isUp?M.usel:M.sel,limit=isUp?UPGRADE:BUDGET,base=new Set(M.rec.controls||[]);
  const spent=cost([...sel]),left=limit-spent;
  return `<div class="tbar"><div class="mtext"><span>${isUp?"Mid-year review: add controls":"Buy your controls"}</span><span>${money(spent)} of ${money(limit)}</span></div>
    <div class="meter ${left<700?"full":""}"><i style="width:${spent/limit*100}%"></i></div>
    <div class="note">${isUp?"Add up to "+money(UPGRADE)+" more. It comes out of your cash. You can also add nothing.":"Tap to buy. You can't afford everything, so think about which frauds are most likely at Hersey Grounds."}</div></div>
    <div class="shop">${CONTROLS.map(c=>{const own=isUp&&base.has(c.id),on=sel.has(c.id),dis=own||(!on&&c.cost>left);
      return `<button class="ctl ${own?"owned":""}" data-id="${c.id}" aria-pressed="${on}" ${dis?"disabled":""}><span class="cn"><b>${esc(c.name)}</b><span class="cost">${own?"Owned":money(c.cost)}</span></span><span class="cd">${esc(c.desc)}</span></button>`}).join("")}</div>
    <div class="lock"><button class="btn main" id="lk">Lock in ${sel.size?sel.size+" control"+(sel.size>1?"s":""):"(no "+(isUp?"new ":"")+"controls)"}</button><span class="note">You can't change it after you lock in.</span></div>`;
}
function wireShop(kind){
  const M=ME,isUp=kind==="up",sel=isUp?M.usel:M.sel;
  app.querySelectorAll(".ctl").forEach(b=>b.onclick=()=>{const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);const y=scrollY;app.innerHTML=shopHTML(kind);wireShop(kind);scrollTo(0,y)});
  $("#lk").onclick=async()=>{if(!confirm(sel.size?`Lock in: ${list([...sel]).join(", ")}?`:"Lock in with no controls?"))return;
    const patch=isUp?{up:[...sel],upLocked:true}:{controls:[...sel],locked:true};Object.assign(M.rec,patch);
    try{await M.N.update(`games/${M.code}/players/${M.pid}`,patch)}catch(e){}M.key=null;teamRender()};
}
function myLine(st){const M=ME;if(!st.cash||st.cash[M.pid]==null)return "";const n=Object.keys(st.cash).length;
  return `<div class="cashline"><span><b>${money(st.cash[M.pid])}</b>cash</span><span><b>${ord(st.rank[M.pid])}</b>of ${n}</span></div>`}
function teamRender(){
  const M=ME,st=M.state;if(!st)return;rejoinBtn();
  const key=JSON.stringify([st.phase,st.i,st.sub,!!M.rec.locked,!!M.rec.upLocked,!!M.rec.schLocked,st.res?1:0,st.cash&&st.cash[M.pid]]);
  if(key===M.key)return;M.key=key;
  if(st.phase==="lobby"){app.innerHTML=`<div class="wait"><h2>You're in, ${esc(M.name)}!</h2><p>Read the company brief on your one-pager and start planning which controls you want.</p></div>`;return}
  if(st.phase==="shop"){
    if(!M.rec.locked){app.innerHTML=shopHTML("buy");wireShop("buy");return}
    app.innerHTML=`<div class="wait"><h2>Locked in</h2><div class="chips" style="justify-content:center">${list(M.rec.controls||[]).map(n=>`<span>${esc(n)}</span>`).join("")||"<span>No controls</span>"}</div><p>Spent ${money(cost(M.rec.controls))}. Starting cash: ${money(START-cost(M.rec.controls))}.</p><p>Waiting for Round 1.</p></div>`;return}
  if(st.phase==="end"){teamReport(st);return}
  const S=STEPS[st.i],head=`<div class="rtag" style="text-align:center;margin-top:10px">Round ${S.r} of 5 · ${ROUNDS[S.r-1]}</div>`;
  if(S.k==="scen"){const s=SCEN[S.id];
    if(st.sub!=="reveal"){app.innerHTML=`${head}<div class="mystory"><b>${esc(s.title)}</b><p>${esc(s.story)}</p><p><b style="display:inline;font-size:20px">At stake: ${money(s.loss)}</b></p></div><div class="wait" style="padding-top:10px"><p>Will your controls catch it? Watch the board.</p></div>${myLine(st)}`;return}
    const r=st.res&&st.res[M.pid];if(!r){app.innerHTML=`${head}<div class="wait"><p>Watch the board.</p></div>`;return}
    app.innerHTML=`${head}<div class="verdict ${r.caught?"ok":"no"}"><h2>${r.caught?"Caught it!":"Stolen: "+money(s.loss)}</h2><p>${r.caught?`Your <b>${esc(CT[r.by].name)}</b> stopped "${esc(s.title)}."`:`You'd have stopped it with <b>${esc(orList(s.stop))}</b>.`}</p><p class="note">${esc(s.why)}</p></div>${myLine(st)}`;
    r.caught?beep(990,.15):beep(220,.3);return}
  if(S.k==="upgrade"){
    if(!M.rec.upLocked){app.innerHTML=head+shopHTML("up");wireShop("up");return}
    app.innerHTML=`${head}<div class="wait"><h2>Locked in</h2><p>${(M.rec.up||[]).length?"Added: "+esc(list(M.rec.up).join(", "))+` for ${money(cost(M.rec.up))}.`:"No new controls."}</p><p>Waiting for Round 3.</p></div>${myLine(st)}`;return}
  if(S.k==="inside"){
    const tid=st.targets&&st.targets[M.pid],tname=st.names&&st.names[tid];
    if(st.sub==="pick"){
      if(M.rec.schLocked){app.innerHTML=`${head}<div class="wait"><h2>Scheme locked in</h2><p>${esc(SC[M.rec.scheme].title)} against ${esc(tname||"your target")}. Keep it secret!</p></div>`;return}
      M.tctl=M.tctl||null;
      if(!M.tctl||M.tctlFor!==tid){M.tctlFor=tid;M.N.get(`games/${M.code}/players/${tid}`).then(r=>{M.tctl=r?[...(r.controls||[]),...(r.up||[])]:[];M.key=null;teamRender()}).catch(()=>{});}
      app.innerHTML=`${head}<div class="target"><div class="note" style="color:#bbb">Your secret target</div><b>${esc(tname||"…")}</b><div class="note" style="color:#bbb;margin-top:6px">Their controls:</div><div class="chips">${M.tctl?(M.tctl.length?list(M.tctl).map(n=>`<span>${esc(n)}</span>`).join(""):"<span>None!</span>"):"<span>Loading…</span>"}</div></div>
        <p class="note">Pick a scheme their controls won't catch. If it works, you take the money from them. If it's caught, you pay a ${money(FINE)} fine.</p>
        <div class="shop">${SCHEMES.map(s=>`<button class="scheme" data-id="${s.id}" aria-pressed="${M.sch===s.id}"><span class="cn" style="display:flex;justify-content:space-between;gap:10px"><b>${esc(s.title)}</b><span class="cost" style="font-family:var(--display);font-weight:700;font-size:24px">+${money(s.gain)}</span></span><span class="cd" style="color:var(--muted)">${esc(s.desc)}</span></button>`).join("")}</div>
        <div class="lock"><button class="btn main" id="lk" ${M.sch?"":"disabled"}>Lock in scheme</button></div>`;
      app.querySelectorAll(".scheme").forEach(b=>b.onclick=()=>{M.sch=b.dataset.id;M.key=null;const y=scrollY;teamRender();scrollTo(0,y)});
      $("#lk").onclick=async()=>{if(!M.sch||!confirm(`Lock in "${SC[M.sch].title}" against ${tname}?`))return;const patch={scheme:M.sch,schLocked:true};Object.assign(M.rec,patch);try{await M.N.update(`games/${M.code}/players/${M.pid}`,patch)}catch(e){}M.key=null;teamRender()};
      return}
    const r=st.res&&st.res[M.pid];if(!r){app.innerHTML=`${head}<div class="wait"><p>Watch the board.</p></div>`;return}
    const a=r.atk,d=r.def;
    const aTxt=!a||a.none?`<div class="mystory"><b>Your scheme</b><p>You didn't pick one.</p></div>`:`<div class="verdict ${a.caught?"no":"ok"}"><h2>${a.caught?"You got caught":"It worked! +"+money(SC[a.scheme].gain)}</h2><p>${esc(SC[a.scheme].title)} against ${esc(st.names[a.target])}. ${a.caught?`Their ${esc(CT[a.by].name)} caught you. Fine: ${money(FINE)}.`:"Their controls didn't stop it."}</p></div>`;
    const dTxt=!d?`<div class="mystory"><b>Nobody attacked you</b></div>`:`<div class="verdict ${d.caught?"ok":"no"}"><h2>${d.caught?"You caught "+esc(st.names[d.from]):esc(st.names[d.from])+" took "+money(SC[d.scheme].gain)}</h2><p>Their scheme: ${esc(SC[d.scheme].title)}. ${d.caught?`Stopped by your ${esc(CT[d.by].name)}.`:`${esc(orList(SC[d.scheme].stop))} would have stopped it.`}</p></div>`;
    app.innerHTML=`${head}${aTxt}${dTxt}${myLine(st)}`;return}
}
function teamReport(st){
  const M=ME,rec=M.rec,n=st.cash?Object.keys(st.cash).length:0;
  const leaks=[],stops=[];STEPS.forEach((s,j)=>{if(s.k!=="scen")return;const sc=SCEN[s.id],o=owned(rec,j),by=sc.stop.find(x=>o.has(x));(by?stops:leaks).push({sc,by})});
  app.innerHTML=`<div class="rep"><h2>${esc(M.name)}: ${money(st.cash?st.cash[M.pid]:0)}</h2><p style="font-size:22px;margin:0">${st.rank?ord(st.rank[M.pid])+" of "+n:""} · Started with ${money(START)}</p>
    <h3 style="font-family:var(--display);font-size:26px;margin:16px 0 4px">What got past you</h3>
    ${leaks.map(l=>`<div class="leak"><b>${esc(l.sc.title)} (−${money(l.sc.loss)})</b>Fix: ${esc(orList(l.sc.stop))}. ${esc(l.sc.why)}</div>`).join("")||`<div class="leak okk"><b>Nothing! Every fraud was caught.</b></div>`}
    <h3 style="font-family:var(--display);font-size:26px;margin:16px 0 4px">What you caught</h3>
    ${stops.map(l=>`<div class="leak okk"><b>${esc(l.sc.title)}</b>Caught by ${esc(CT[l.by].name)}.</div>`).join("")||`<div class="leak"><b>Nothing caught this time.</b></div>`}
    <p class="note" style="margin-top:14px">Your controls: ${esc(list([...(rec.controls||[]),...(rec.up||[])]).join(", ")||"none")}</p></div>`;
  try{localStorage.removeItem(SKEY)}catch(e){}
}

/* ============================================================ START */
$("#rejoin").onclick=rejoin;
ROLE==="teacher"?hostSetup():joinForm();
</script>
</body>
