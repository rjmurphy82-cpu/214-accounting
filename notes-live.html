<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes Live</title>
<meta name="description" content="Chapter 7 notes receivable class game for District 214 Accounting: join your teacher's game with a code, then practice your weakest skills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3F3; --paper:#FFFFFF; --ink:#111111; --muted:#5C5C5C; --dark:#111111; --soft:#F7F6F6;
  --red:#C1102F; --red2:#D9203F; --accent:#C1102F; --line:rgba(17,17,17,.14);
  --good:#1E7A3C; --goodsoft:#E7F4EB; --bad:#C1102F; --badsoft:#FBE7EA;
  --c0:#C1102F; --c1:#1F5FAD; --c2:#9A6B00; --c3:#23763A;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --k:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121212;--paper:#1E1E1E;--ink:#F2F2F2;--muted:#A8A8A8;--dark:#2B2B2B;--soft:#262626;--accent:#FF4D63;--line:rgba(242,242,242,.14);--good:#3FB86A;--goodsoft:#123020;--bad:#FF4D63;--badsoft:#3A1219;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121212;--paper:#1E1E1E;--ink:#F2F2F2;--muted:#A8A8A8;--dark:#2B2B2B;--soft:#262626;--accent:#FF4D63;--line:rgba(242,242,242,.14);--good:#3FB86A;--goodsoft:#123020;--bad:#FF4D63;--badsoft:#3A1219;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;font-weight:600}
.top a{color:inherit;text-decoration:none}.top a:hover{text-decoration:underline}
.d214{height:36px;width:auto;background:#fff;padding:3px 6px;border-radius:4px;display:block}
.top .sp{flex:1}
.pill{background:var(--dark);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.5vw,72px);line-height:.98;margin:22px 0 8px}
h1.title span{color:var(--accent)}
.lede{max-width:62ch;color:var(--muted);margin:0 0 22px}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.door:hover{border-color:var(--ink)}
.door b{font-family:var(--display);font-weight:600;font-size:26px}
.door span{color:var(--muted);font-size:16px}
.door .tag{align-self:flex-start;background:var(--red);color:#fff;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:700;letter-spacing:.04em}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:620px;margin:20px auto 0}
.panel h2{font-family:var(--display);font-weight:600;font-size:32px;margin:0 0 6px}
.panel p{color:var(--muted);margin:0 0 14px}
.field{display:block;width:100%;font-size:26px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--soft);margin:6px 0 14px}
.field.code{letter-spacing:.3em;text-align:center;font-family:var(--display);font-size:40px}
.btn{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 18px;font-weight:700}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--display);font-weight:600;font-size:24px;padding:10px 30px}
.btn.main:hover{background:var(--red2)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.seg button{background:var(--soft);border:2px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark)}
.note{font-size:15px;color:var(--muted)}

/* question */
.qwrap{display:flex;flex-direction:column;gap:calc(10px * var(--k))}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .rd{font-family:var(--display);font-weight:600;font-size:calc(20px * var(--k));letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.qhead .num{color:var(--muted);font-weight:700;font-size:calc(16px * var(--k))}
.qhead .score{margin-left:auto;font-family:var(--display);font-weight:600;font-size:calc(24px * var(--k))}
.timer{height:calc(12px * var(--k));background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--good);width:100%;transform-origin:left;transition:background .3s}
.timer.low i{background:var(--bad)}
.secs{font-family:var(--display);font-weight:600;font-size:calc(22px * var(--k));min-width:2.4em;text-align:center;background:var(--dark);color:#fff;border-radius:8px;padding:0 10px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:calc(18px * var(--k)) calc(22px * var(--k))}
.prompt{font-size:calc(30px * var(--k));font-weight:600;line-height:1.28;margin:0}
.data{margin-top:calc(10px * var(--k));border-collapse:collapse;font-size:calc(23px * var(--k));min-width:min(520px,100%)}
.data td{padding:calc(3px * var(--k)) 0;border-bottom:1px solid var(--line)}
.data td:last-child{text-align:right;font-weight:700;padding-left:30px;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(10px * var(--k))}
.opt{display:flex;gap:calc(14px * var(--k));align-items:center;text-align:left;border:0;border-radius:12px;padding:calc(10px * var(--k)) calc(16px * var(--k));min-height:calc(70px * var(--k));font-size:calc(23px * var(--k));font-weight:700;color:#fff;background:var(--oc);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.opt:hover:not(:disabled){filter:brightness(1.08)}
.opt .sh{flex:none;width:calc(40px * var(--k));height:calc(40px * var(--k));border-radius:8px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-family:var(--display);font-size:calc(22px * var(--k))}
.opt:disabled{cursor:default}
.opt.dim{opacity:.32}
.opt.right{outline:5px solid var(--good);outline-offset:2px;opacity:1}
.opt.pick{outline:5px solid var(--ink);outline-offset:2px}
.opt .je{display:grid;grid-template-columns:1fr auto;column-gap:14px;width:100%;font-size:.92em}
.opt .je .cr{padding-left:1.4em}
.fb{border-radius:12px;padding:calc(10px * var(--k)) calc(16px * var(--k));font-size:calc(20px * var(--k));border-left:8px solid var(--good);background:var(--goodsoft)}
.fb.no{border-color:var(--bad);background:var(--badsoft)}
.fb b{display:block;font-family:var(--display);font-weight:600;font-size:1.15em}
.fb .pts{float:right;font-family:var(--display);font-size:1.3em;color:var(--good)}
.fb.no .pts{color:var(--bad)}
.next{align-self:flex-end}
.interstitial{text-align:center;padding:60px 10px}
.interstitial .r{font-family:var(--display);color:var(--accent);font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.interstitial h2{font-family:var(--display);font-weight:700;font-size:clamp(46px,8vw,92px);line-height:1;margin:8px 0 10px}
.interstitial p{color:var(--muted);font-size:22px;max-width:44ch;margin:0 auto 22px}

/* report */
.rep h2{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,54px);margin:10px 0 4px;line-height:1.05}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 18px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.stat span{color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.skills{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 16px}
.sk{display:grid;grid-template-columns:200px 1fr 80px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.sk .bar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.sk .bar i{display:block;height:100%;background:var(--good)}
.sk .bar i.mid{background:#C98A00}.sk .bar i.lo{background:var(--bad)}
.sk .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.todo{margin-top:18px}
.todo h3{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 8px}
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--red);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.tip .t{flex:1}
.tip b{font-family:var(--display);font-weight:600;font-size:21px;display:block}
.tip .done{color:var(--good);font-weight:700;font-size:15px}
.links{margin-top:16px;color:var(--muted);font-size:16px}
.links a{color:var(--accent);font-weight:700}

/* live host */
.lobby{text-align:center}
.endgrid{display:grid;gap:18px;margin-top:14px}
@media (min-width:1000px){.endgrid{grid-template-columns:1fr 1.25fr}}
.lobby .join{font-size:clamp(20px,2.4vw,30px);color:var(--muted);font-weight:600}
.lobby .code{font-family:var(--display);font-weight:700;font-size:clamp(80px,14vw,170px);line-height:1;letter-spacing:.12em;margin:6px 0}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.names span{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:clamp(18px,1.8vw,24px)}
.count{font-family:var(--display);font-size:calc(22px * var(--k));font-weight:600}
.lb{display:grid;gap:calc(8px * var(--k));max-width:820px;margin:0 auto;width:100%}
.lb div{display:flex;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:calc(6px * var(--k)) calc(16px * var(--k));font-size:calc(24px * var(--k));font-weight:700}
.lb div .p{width:2em;color:var(--muted);font-family:var(--display)}
.lb div .s{margin-left:auto;font-family:var(--display)}
.lb div.me{border-color:var(--red)}
body.wide .wrap{max-width:min(96vw,1500px)}
body.fit .wrap{max-width:min(98vw,2200px)}
body.fit .top{font-size:calc(14px * var(--k))}

/* student device */
.wait{text-align:center;padding:60px 10px}
.wait h2{font-family:var(--display);font-size:clamp(32px,6vw,54px);margin:0 0 8px}
.wait p{color:var(--muted);font-size:20px}
.big{font-family:var(--display);font-size:clamp(46px,10vw,90px);font-weight:700;line-height:1}
@media (max-width:760px){.doors{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.sk{grid-template-columns:1fr 70px}.sk .bar{grid-column:1 / -1;order:3}.tip{flex-direction:column;align-items:stretch}.tip .prac,.tip #again{width:100%}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* finale */
body.finale-on{overflow:hidden}
body.finale-on .top{visibility:hidden}
.finale{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 110%,#5a0614 0%,#1a0207 45%,#070707 100%);color:#fff;display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;padding:2.2vh 3vw 2vh;overflow:hidden}
.finale canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.finale .rays{position:absolute;left:50%;top:62%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 8deg,transparent 8deg 22deg);animation:spin 60s linear infinite;z-index:0;mask:radial-gradient(circle,#000 0%,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0%,transparent 55%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.fhead{position:relative;z-index:2;text-align:center}
.fhead .lg{height:clamp(34px,6vh,64px);display:block;margin:0 auto 1vh;border-radius:4px}
.fhead .kick{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;color:#FF4D63;font-size:clamp(14px,2.2vh,26px)}
.fhead h2{font-family:var(--display);font-weight:700;font-size:clamp(48px,10vh,130px);line-height:.95;margin:0;background:linear-gradient(180deg,#fff 45%,#F4B6C0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(193,16,47,.6))}
.podium{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:1.6vw;width:min(92vw,1500px);align-self:end}
.pod{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px) scale(.9);transition:opacity .5s, transform .7s cubic-bezier(.2,1.6,.4,1)}
.pod.in{opacity:1;transform:none}
.pod.empty{visibility:hidden}
.pod .who{text-align:center;margin-bottom:1.2vh;max-width:100%}
.pod .medal{width:clamp(44px,8vh,96px);height:clamp(44px,8vh,96px);border-radius:50%;display:grid;place-items:center;margin:0 auto .8vh;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vh,56px);color:#3b2600;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 24px rgba(0,0,0,.4)}
.p1 .medal{background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#C98A00)}
.p2 .medal{background:radial-gradient(circle at 35% 30%,#FFFFFF,#CFD6DD 55%,#8C98A3)}
.p3 .medal{background:radial-gradient(circle at 35% 30%,#FFD9B8,#D88B4A 55%,#8E4F1C);color:#2b1300}
.pod .nm{font-family:var(--display);font-weight:600;font-size:clamp(26px,5.4vh,72px);line-height:1.05;overflow-wrap:anywhere}
.p1 .nm{font-size:clamp(32px,7vh,96px);color:#fff;text-shadow:0 0 24px rgba(232,25,60,.8)}
.pod .pts{font-weight:700;font-size:clamp(18px,3.2vh,40px);opacity:.85}
.pod .block{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:1.4vh;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vh,80px);color:rgba(255,255,255,.92);background:linear-gradient(180deg,#E0213F,#8F0A20);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 -10px 40px rgba(193,16,47,.35)}
.p1 .block{height:26vh;background:linear-gradient(180deg,#F23A55,#A90C26)}
.p2 .block{height:18vh}
.p3 .block{height:13vh}
.p1.in .who{animation:pop 1.2s ease-out .2s 2}
@keyframes pop{50%{transform:scale(1.08)}}
.rest{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;width:min(92vw,1500px);margin-top:1.6vh}
.row45{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:1vh 1.4vw;font-size:clamp(20px,3.6vh,44px);font-weight:700;opacity:0;transform:translateX(-30px);transition:opacity .5s, transform .5s}
.row45.in{opacity:1;transform:none}
.row45 .r{font-family:var(--display);color:#FF4D63;min-width:1.4em}
.row45 .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row45 .s{opacity:.8}
.fbar{position:relative;z-index:4;display:flex;gap:10px;margin-top:1.6vh;opacity:.55;transition:opacity .2s}
.fbar:hover{opacity:1}
.fbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-size:15px;padding:6px 14px}
@media (max-width:700px){.rest{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.finale .rays{animation:none}.pod,.row45{transition:none}.p1.in .who{animation:none}}

/* student live: big answer buttons that fill the screen */
body.stu-live .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
body.stu-live #app{flex:1;display:flex;flex-direction:column}
body.stu-live .qwrap{flex:1;gap:10px}
body.stu-live .prompt{font-size:clamp(20px,2.6vh + 1vw,30px)}
body.stu-live .data{font-size:clamp(17px,2.2vh,24px)}
body.stu-live .opts{flex:1;grid-auto-rows:minmax(84px,1fr);gap:12px}
body.stu-live .opt{min-height:0;height:100%;font-size:clamp(20px,2.4vh + .6vw,30px);padding:14px 18px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
body.stu-live .opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
body.stu-live .opt .sh{width:48px;height:48px;font-size:26px}
@media (max-width:760px){body.stu-live .opts{grid-template-columns:1fr}}
.rejoin{margin-left:8px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:7px 16px;font:700 16px var(--body);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.big-rejoin{font-size:28px;padding:14px 34px}
.count .kick{display:block;font-size:.6em;color:var(--muted);font-family:var(--body);font-weight:600}

/* per-question scoreboard (projector) */
body.host-reveal #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,34%);gap:calc(18px * var(--k));align-items:stretch}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(10px * var(--k));align-items:end;height:calc(96px * var(--k));margin-top:calc(10px * var(--k));border-bottom:3px solid var(--ink)}
.dist div{height:var(--h);background:var(--oc);border-radius:8px 8px 0 0;color:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(4px * var(--k));min-height:calc(30px * var(--k));transform-origin:bottom;animation:grow .6s cubic-bezier(.2,1.2,.4,1) both}
.dist div b{font-family:var(--display);font-weight:700;font-size:calc(22px * var(--k))}
.dist div.wrong{opacity:.3}
.dist div.ok{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--good)}
@keyframes grow{from{transform:scaleY(0)}}
.sb{position:relative;display:flex;flex-direction:column;gap:calc(10px * var(--k));background:linear-gradient(165deg,#1b1b1b 0%,#0c0c0c 60%,#2a0610 100%);color:#fff;border-radius:16px;padding:calc(16px * var(--k)) calc(16px * var(--k)) calc(14px * var(--k));border-top:calc(6px * var(--k)) solid #C1102F;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden}
.sb::after{content:"";position:absolute;right:-30%;top:-40%;width:90%;height:90%;background:radial-gradient(circle,rgba(193,16,47,.35),transparent 65%);pointer-events:none}
.sbh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;position:relative}
.sbh span{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:calc(22px * var(--k))}
.sbh small{color:#bdbdbd;font-weight:700;font-size:calc(15px * var(--k))}
.sbrows{display:flex;flex-direction:column;gap:calc(8px * var(--k));flex:1;position:relative}
.sbr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:calc(12px * var(--k));row-gap:calc(5px * var(--k));align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:calc(9px * var(--k)) calc(12px * var(--k))}
.sb.anim .sbr{animation:slidein .55s cubic-bezier(.2,1.1,.4,1) both;animation-delay:var(--d)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.sbr .rk{grid-row:1 / 3;width:calc(44px * var(--k));height:calc(44px * var(--k));border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:calc(24px * var(--k));border:2px solid rgba(255,255,255,.35);color:#fff}
.sbr.r1 .rk{background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#C98A00);color:#3b2600;border:0}
.sbr.r2 .rk{background:radial-gradient(circle at 35% 30%,#fff,#CFD6DD 55%,#8C98A3);color:#222;border:0}

function shuffle(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function optHTML(v){

  if(typeof v==="number")return money(v);
  return esc(v);
}

  ORDER.forEach(sk=>{shuffle(BANK.filter(q=>q.sk===sk),r).slice(0,perSkill).forEach(q=>list.push(q.id))});
  return list;
}
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
function points(ok,ms,secs){return ok?Math.round(600+400*Math.max(0,1-ms/(secs*1000))):0}
let timeMult=1;
const secsFor=q=>Math.round(SKILLS[q.sk].secs*timeMult);
function beep(f,d){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

    TICK=setInterval(()=>{const left=Math.max(0,o.secs-(performance.now()-t0)/1000);bar.style.transform=`scaleX(${left/o.secs})`;const c=Math.ceil(left);if(c!==last){last=c;sec.textContent=c;if(c<=3&&c>0)beep(880,.05)}tm.classList.toggle("low",left<=5);if(left<=0)pick(-1)},100);
  }

    <div class="todo"><h3>${perfect?"What to work on":"Practice these next"}</h3>

    </div>

function mockNet(){
  const KEY="bankRecLiveMock",bc=("BroadcastChannel" in window)?new BroadcastChannel(KEY):null,subs=[];
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
  const write=t=>{localStorage.setItem(KEY,JSON.stringify(t));fire();if(bc)bc.postMessage(1)};
  const at=(t,p)=>p.split("/").filter(Boolean).reduce((o,k)=>o==null?undefined:o[k],t);
  const put=(t,p,v)=>{const ks=p.split("/").filter(Boolean);let o=t;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||o[k]===null)o[k]={};o=o[k]});if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v};
  const fire=()=>{const t=read();subs.forEach(s=>{const v=JSON.stringify(at(t,s.p)??null);if(v!==s.last){s.last=v;s.cb(JSON.parse(v))}})};
  if(bc)bc.onmessage=fire;window.addEventListener("storage",e=>{if(e.key===KEY)fire()});
  return{
    kind:"mock",
    get:async p=>at(read(),p)??null,
    set:async(p,v)=>{const t=read();put(t,p,v);write(t)},
    update:async(p,o)=>{const t=read();Object.entries(o).forEach(([k,v])=>put(t,p+"/"+k,v));write(t)},
    remove:async p=>{const t=read();put(t,p,null);write(t)},
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.push(s);setTimeout(fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  };
}
async function vercelNet(){
  const call=async(op,path,v)=>{const r=await fetch("/api/live",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,path,v})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
  try{const p=await call("ping");if(!p.ok)return null}catch(e){return null}
  return{kind:"vercel",
    get:async p=>(await call("get",p)).v??null,
    set:(p,v)=>call("set",p,v),
    update:(p,o)=>call("update",p,o),
    remove:p=>call("remove",p),
    on:(p,cb)=>{let last,stop=false,t;
      const tick=async()=>{if(stop)return;
        if(!document.hidden){try{const v=(await call("get",p)).v??null,s=JSON.stringify(v);if(s!==last){last=s;cb(v)}}catch(e){}}
        if(!stop)t=setTimeout(tick,1200)};
      tick();return()=>{stop=true;clearTimeout(t)}}};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
let NET=null;
async function net(){
  if(NET)return NET;

  await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
  const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(CFG);const db=fb.database();
  NET={kind:"firebase",
    get:async p=>(await db.ref(p).get()).val(),
    set:(p,v)=>db.ref(p).set(v),
    update:(p,o)=>db.ref(p).update(o),
    remove:p=>db.ref(p).remove(),
    on:(p,cb)=>{const r=db.ref(p),h=s=>cb(s.val());r.on("value",h);return()=>r.off("value",h)}};
  return NET;
}

function kickIdle(qi){ // anyone with no answer on 3 straight questions is taken out
  const H=HOST,gone=[];
  activeArr().forEach(p=>{const ans=Object.entries(p.a||{}).filter(([,x])=>x&&x.c>=0).map(([q])=>+q);
    const last=Math.max(p.base==null?-1:p.base,...ans);
    if(qi-last>=3){H.players[p.id]={...H.players[p.id],out:true};H.N.update(`games/${H.code}/players/${p.id}`,{out:true}).catch(()=>{});gone.push(p.name)}});
  return gone}

  const doneQi=st.phase==="reveal"||st.phase==="end"?st.qi:st.qi-1;
  const lastAns=()=>Math.max(M.base,...Object.entries(M.answered).filter(([,x])=>x.c>=0).map(([q])=>+q));
  if(!M.out&&st.phase!=="lobby"&&st.phase!=="end"){
    const pending=st.phase==="reveal"&&!M.answered[st.qi]?st.qi:doneQi;
    if(pending-lastAns()>=3){M.out=true;M.N.update(`games/${M.code}/players/${M.pid}`,{out:true}).catch(()=>{})}
  }
  if(M.out&&st.phase!=="end"){if(M.rq!=="out")kickedScreen();return}
  const live=st.phase==="question"&&!M.answered[st.qi];
  if(!live)document.body.classList.remove("stu-live");
  if(st.phase==="lobby"){app.innerHTML=`<div class="wait"><h2>You're in, ${esc(M.name)}!</h2><p>Watch the board. The game starts soon.</p></div>`;return}
  if(st.phase==="intro"){stopTick();const sk=byId[M.ids[st.qi]].sk;app.innerHTML=`<div class="wait"><div class="r" style="color:var(--accent);font-family:var(--display);letter-spacing:.1em">ROUND ${ORDER.indexOf(sk)+1}</div><h2>${esc(SKILLS[sk].name)}</h2><p>${esc(SKILLS[sk].desc)}</p><div class="big">${M.score.toLocaleString()}</div><p>points so far</p></div>`;M.rq=null;return}
  const q=inst(byId[M.ids[st.qi]],M.seed),secs=secsFor(q);
  if(st.phase==="question"){
    if(M.answered[st.qi]){if(M.rq!==st.qi+"w"){M.rq=st.qi+"w";setFit(false);app.innerHTML=`<div class="wait"><h2>Answer locked in</h2><p>Waiting for everyone else…</p></div>`}return}
    if(M.rq===st.qi)return;M.rq=st.qi;
    document.body.classList.add("stu-live");
    renderQuestion(app,q,{label:SKILLS[q.sk].name,num:`Question ${st.qi+1} of ${M.ids.length}`,score:M.score,timed:true,secs,noFit:true,onAnswer:(c,ms)=>{
      if(M.answered[st.qi]||M.out)return;
      if(c<0){document.body.classList.remove("stu-live");app.innerHTML=`<div class="wait"><h2>Time's up</h2><p>Waiting for the answer…</p></div>`;M.rq=st.qi+"w";return} // the reveal records the miss
      const ok=c===q.ans,old=M.score;M.score=old+(ok?points(ok,ms,secs):-M.pen);const pts=M.score-old;M.answered[st.qi]={c,ok,pts,ms};M.log.push({sk:q.sk,ok,ms});
      M.N.update(`games/${M.code}/players/${M.pid}`,{score:M.score,["a/"+st.qi]:{c,ok,ms:Math.round(ms),pts}});
      document.body.classList.remove("stu-live");setFit(false);app.innerHTML=`<div class="wait"><h2>Answer locked in</h2><p>Waiting for everyone else…</p></div>`;M.rq=st.qi+"w";
    }});
    return;
  }
  if(st.phase==="reveal"){
    stopTick();
    const rkKey=st.qi+"r"+(st.ranks&&st.ranks[M.pid]?st.ranks[M.pid].join("."):"");
    if(M.rq===rkKey)return;M.rq=rkKey;
    let a=M.answered[st.qi];
    if(!a){a={c:-1,ok:false,pts:0,ms:secs*1000};M.answered[st.qi]=a;M.log.push({sk:q.sk,ok:false,ms:secs*1000});M.N.update(`games/${M.code}/players/${M.pid}`,{["a/"+st.qi]:{c:-1,ok:false,ms:secs*1000,pts:0}})}
    app.innerHTML=`<div class="wait"><h2 style="color:${a.ok?"var(--good)":"var(--bad)"}">${a.ok?"Correct!":a.c<0?"Time's up":"Not quite"}</h2><div class="big" style="color:${a.pts<0?"var(--bad)":"inherit"}">${a.pts<0?"−"+(-a.pts).toLocaleString():"+"+a.pts.toLocaleString()}</div>${!a.ok&&a.c>=0&&M.pen?`<p>Wrong answers cost ${M.pen.toLocaleString()} points. If you are not sure, let the clock run out for 0.</p>`:""}<p>${a.ok?"":"Answer: "+esc(optText(q.opts[q.ans]))+"<br>"}${esc(q.x)}</p><p><b>${M.score.toLocaleString()}</b> points total</p>${placeHTML(st)}</div>`;
    return;
  }
  if(st.phase==="end"){
    stopTick();if(M.rq==="end")return;M.rq="end";
    if(st.cut!=null&&M.answered[st.cut]){const x=M.answered[st.cut];M.score-=x.pts||0;M.log.pop();delete M.answered[st.cut]}
    const fin=()=>{try{localStorage.removeItem(SKEY)}catch(e){}};
    M.N.get(`games/${M.code}/players`).then(ps=>{const arr=Object.values(ps||{}).filter(p=>!p.out).map(p=>adjP(p,st.cut).score||0).sort((a,b)=>b-a);const rank=arr.indexOf(M.score)+1;if(M.off)M.off();const keep=M;ME=null;fin();rejoinBtn();report(keep.name,keep.log,keep.score,rank||null)}).catch(()=>{const keep=M;ME=null;fin();rejoinBtn();report(keep.name,keep.log,keep.score,null)});
  }
}

$("#rejoin").onclick=rejoin;
home();
rejoinBtn();
</script>
</body>
</html>
