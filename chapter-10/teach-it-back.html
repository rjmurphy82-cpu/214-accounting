<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Teach It Back: Bonds | Accounting Chapter 10</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C1102F;--dk:#8E0B22;--ink:#141414;--mu:#5E5E5E;--ln:#DADADA;--bg:#F4F4F2;--ok:#1E8A4C;--bad:#C1102F;--gold:#E3A500;
  --k1:#E21B3C;--k2:#1368CE;--k3:#D89E00;--k4:#26890C;--fs:1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{font-size:calc(19px*var(--fs))}
h1,h2,h3,.osw{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
input,select{font:inherit}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:5}
.logo{background:var(--red);font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:700;padding:4px 10px;border-radius:6px;font-size:20px}
.top .t{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:21px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{color:#ff8a9c}
.tb{background:#2b2b2b;color:#fff;padding:7px 12px;font-size:16px}
.tb:active{background:#444}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.panel{background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.btn{background:var(--red);color:#fff;padding:13px 22px;font-weight:700;font-size:1.05em}
.btn:active{background:var(--dk)}
.btn.sec{background:#e9e9e9;color:var(--ink)}
.btn.gold{background:var(--gold);color:#111}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.hintbox{margin-top:12px}
.hintbox .worth{font-size:.9em;margin-bottom:6px}
.hint{background:#FFF7E0;border-left:5px solid var(--gold);padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:.92em;line-height:1.4}
.hbtn{background:#FFF7E0;color:#5a4300;border:2px solid var(--gold);padding:9px 14px;font-size:.92em}
.grid17{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.blk{background:#fff;border:2px solid var(--ln);border-radius:12px;padding:12px;text-align:left;min-height:96px}
.blk .n{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:15px;color:var(--mu);text-transform:uppercase}
.blk .nm{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:20px;margin:2px 0}
.blk .rl{font-size:15px;color:var(--mu)}
.blk.k{border-color:var(--k2);background:#EEF4FC}
.blk.done{border-color:var(--ok);background:#EFF8F2}
.blk.done .n::after{content:"  ✓ done";color:var(--ok)}
.role{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.role div{border-radius:12px;padding:12px 16px;color:#fff}
.role .te{background:var(--ink)}
.role .le{background:var(--red)}
.role b{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:1.15em;display:block}
.role small{opacity:.85;font-size:.85em}
.work{display:grid;grid-template-columns:1fr 1.05fr;gap:16px;align-items:start}
.prob{font-size:1.12em;line-height:1.45}
.prob .co{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:1.25em;color:var(--red)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;background:var(--bg);padding:12px 14px;border-radius:10px}
.facts dt{color:var(--mu)}
.facts dd{margin:0;font-weight:700}
.prog{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.prog i{width:30px;height:9px;border-radius:5px;background:var(--ln)}
.prog i.on{background:var(--ink)}
.prog i.ok{background:var(--ok)}
.prog i.half{background:var(--gold)}
.prog i.miss{background:var(--bad)}
.fld{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}
.fld label{font-weight:600}
.fld input,.fld select{width:100%;padding:10px 12px;border:2px solid var(--ln);border-radius:9px;font-size:1.05em;text-align:right;background:#fff}
.fld select{text-align:left}
.good{border-color:var(--ok)!important;background:#EFF8F2!important}
.wrong{border-color:var(--bad)!important;background:#FDEEF0!important}
.je{width:100%;border-collapse:collapse;margin-top:6px}
.je th{background:var(--ink);color:#fff;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;padding:6px 8px;text-align:left;font-size:.85em}
.je td{padding:4px}
.je select,.je input{width:100%;padding:9px 8px;border:2px solid var(--ln);border-radius:8px;font-size:.98em;background:#fff}
.je input{text-align:right}
.je td.a{width:24%}
.jelbl{font-family:Oswald,"Arial Narrow",Arial,sans-serif;margin-top:14px;font-size:1.05em}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:1em;line-height:1.4}
.fb.ok{background:#EFF8F2;border-left:6px solid var(--ok)}
.fb.no{background:#FDEEF0;border-left:6px solid var(--bad)}
.fb.show{background:#FFF7E0;border-left:6px solid var(--gold)}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:64px;line-height:1}
.center{text-align:center}
.code{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:46px;letter-spacing:.2em;background:var(--ink);color:#fff;display:inline-block;padding:6px 22px;border-radius:12px}
.muted{color:var(--mu)}
.tag{display:inline-block;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:.8em;padding:2px 9px;border-radius:20px;background:var(--gold);color:#111;margin-left:8px;vertical-align:middle}
.steps{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.steps span{font-family:Oswald,"Arial Narrow",Arial,sans-serif;padding:5px 12px;border-radius:20px;background:#e9e9e9;font-size:.85em}
.steps span.on{background:var(--ink);color:#fff}
.steps span.ok{background:var(--ok);color:#fff}
/* kahoot */
.kq{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:1.65em;line-height:1.25;text-align:center;margin:8px 0 16px}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kopt{color:#fff;font-size:1.15em;font-weight:700;padding:22px 18px;min-height:110px;text-align:left;display:flex;gap:14px;align-items:center;border-radius:12px}
.kopt .sh{font-size:1.6em;width:34px;flex:none;text-align:center}
.kopt:nth-child(1){background:var(--k1)}.kopt:nth-child(2){background:var(--k2)}.kopt:nth-child(3){background:var(--k3)}.kopt:nth-child(4){background:var(--k4)}
.kopt.dim{opacity:.3}
.dvote{display:grid;gap:10px}
.dopt{text-align:left;background:#fff;border:2px solid var(--ln);padding:14px 16px;font-size:1.1em;line-height:1.35;display:flex;gap:14px;align-items:flex-start}
.dopt .osw{font-size:1.3em;color:var(--red);min-width:24px}
.dopt.on{border-color:var(--k2);background:#EEF4FC;box-shadow:0 0 0 3px var(--k2)}
.dlist{display:grid;gap:8px}
.dent{display:flex;gap:14px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--bg);font-size:22px;line-height:1.3}
.dent .osw{font-size:28px;color:var(--red);min-width:30px}
.dent.real{background:#EFF8F2;outline:3px solid var(--ok)}
.dent .by{font-size:16px;color:var(--mu);margin-top:3px}
.dent .vc{margin-left:auto;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:26px;white-space:nowrap}
.dent .hd{margin-left:auto;background:#e3e3e3;padding:4px 10px;font-size:14px}
.kopt.right{outline:6px solid #111}
.kbar{height:12px;background:#e3e3e3;border-radius:6px;overflow:hidden;margin-bottom:10px}
.kbar i{display:block;height:100%;background:var(--k2);transition:width .25s linear}
.kmeta{display:flex;justify-content:space-between;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:1.1em;margin-bottom:8px}
/* pv tables */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .box{background:#fff;border-radius:14px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.pvt{border-collapse:collapse;font-size:14px;width:100%}
.pvt th,.pvt td{border:1px solid #ddd;padding:3px 5px;text-align:right}
.pvt th{background:var(--ink);color:#fff;position:sticky;top:0}
.pvt td:first-child,.pvt th:first-child{text-align:center;font-weight:700;background:#f1f1f1;color:#111}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{padding:8px 14px;background:#e9e9e9}
.tabs button.on{background:var(--ink);color:#fff}
/* host */
#qr svg{width:100%;height:100%;display:block;border-radius:8px}
.hostgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.timer{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:150px;line-height:1;text-align:center;letter-spacing:.02em}
.timer.low{color:var(--red)}
.now{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:46px;line-height:1.1}
.now small{display:block;font-size:24px;color:var(--mu);margin-bottom:6px}
.whob{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.whob div{border-radius:12px;padding:14px;color:#fff;font-size:22px}
.whob b{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:30px;display:block}
.sched{list-style:none;padding:0;margin:0;max-height:640px;overflow:auto}
.sched li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:17px;cursor:pointer}
.sched li.on{background:var(--ink);color:#fff}
.sched li .no{font-family:Oswald,"Arial Narrow",Arial,sans-serif;width:56px}
.sched li.kk{color:var(--k2);font-weight:700}
.sched li.on.kk{color:#fff;background:var(--k2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk input{padding:9px;border:2px solid var(--ln);border-radius:8px;width:110px;font-size:17px}
/* print scorecard */
.sc{display:none}
@media print{
  body{background:#fff}
  .noprint,.top,.wrap{display:none!important}
  .sc{display:block;font-family:Barlow,sans-serif;font-size:11pt}
  .sc .pg{page-break-after:always;padding:.2in}
  .sc h1{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-size:20pt;margin-bottom:2px}
  .sc table{width:100%;border-collapse:collapse;margin-top:8px}
  .sc th{background:#141414;color:#fff;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;padding:5px;text-align:left;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sc td{border-bottom:1px solid #999;padding:0 6px;height:.39in}
  .sc tr.k td{background:#EEF4FC;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sc .nm{display:flex;gap:30px;margin-top:6px}
  .sc .nm div{flex:1;border-bottom:1.5px solid #000;padding-bottom:2px}
  @page{size:letter;margin:.4in}
}
@media (max-width:900px){.work,.hostgrid{grid-template-columns:1fr}}
:root{--display:Oswald,"Arial Narrow",Arial,sans-serif}
body.finale-on{overflow:hidden}
body.finale-on .top{visibility:hidden}
.finale{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 110%,#5a0614 0%,#1a0207 45%,#070707 100%);color:#fff;display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;padding:2.2vh 3vw 2vh;overflow:hidden}

@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.fhead{position:relative;z-index:2;text-align:center}
.fhead .lg{height:clamp(34px,6vh,64px);display:block;margin:0 auto 1vh;border-radius:4px}
.fhead .kick{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;color:#FF4D63;font-size:clamp(14px,2.2vh,26px)}
.fhead h2{font-family:var(--display);font-weight:700;font-size:clamp(48px,10vh,130px);line-height:.95;margin:0;background:linear-gradient(180deg,#fff 45%,#F4B6C0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(193,16,47,.6))}
.podium{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:1.6vw;width:min(92vw,1500px);align-self:end}
.pod{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px) scale(.9);transition:opacity .5s, transform .7s cubic-bezier(.2,1.6,.4,1)}
.pod.in{opacity:1;transform:none}
.pod.empty{visibility:hidden}
.pod .who{text-align:center;margin-bottom:1.2vh;max-width:100%}
.pod .medal{width:clamp(44px,8vh,96px);height:clamp(44px,8vh,96px);border-radius:50%;display:grid;place-items:center;margin:0 auto .8vh;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vh,56px);color:#3b2600;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 24px rgba(0,0,0,.4)}
.p1 .medal{background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#C98A00)}
.p2 .medal{background:radial-gradient(circle at 35% 30%,#FFFFFF,#CFD6DD 55%,#8C98A3)}
.p3 .medal{background:radial-gradient(circle at 35% 30%,#FFD9B8,#D88B4A 55%,#8E4F1C);color:#2b1300}
.pod .nm{font-family:var(--display);font-weight:600;font-size:clamp(26px,5.4vh,72px);line-height:1.05;overflow-wrap:anywhere}
.p1 .nm{font-size:clamp(32px,7vh,96px);color:#fff;text-shadow:0 0 24px rgba(232,25,60,.8)}
.pod .pts{font-weight:700;font-size:clamp(18px,3.2vh,40px);opacity:.85}
.pod .block{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:1.4vh;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vh,80px);color:rgba(255,255,255,.92);background:linear-gradient(180deg,#E0213F,#8F0A20);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 -10px 40px rgba(193,16,47,.35)}
.p1 .block{height:26vh;background:linear-gradient(180deg,#F23A55,#A90C26)}
.p2 .block{height:18vh}
.p3 .block{height:13vh}
.p1.in .who{animation:pop 1.2s ease-out .2s 2}
@keyframes pop{50%{transform:scale(1.08)}}
.rest{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;width:min(92vw,1500px);margin-top:1.6vh}
.row45{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:1vh 1.4vw;font-size:clamp(20px,3.6vh,44px);font-weight:700;opacity:0;transform:translateX(-30px);transition:opacity .5s, transform .5s}
.row45.in{opacity:1;transform:none}
.row45 .r{font-family:var(--display);color:#FF4D63;min-width:1.4em}
.row45 .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row45 .s{opacity:.8}
.fbar{position:relative;z-index:4;display:flex;gap:10px;margin-top:1.6vh;opacity:.55;transition:opacity .2s}
.fbar:hover{opacity:1}
.fbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-size:15px;padding:6px 14px}
@media (max-width:700px){.rest{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.finale .rays{animation:none}.pod,.row45{transition:none}.p1.in .who{animation:none}.timer.done{animation:none}}
.btn{border:1px solid transparent}
</style>

<body>
<div class="top noprint"><a href="/" style="display:flex"><img src="/logo-214.png" alt="District 214" style="height:30px;border-radius:4px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'214'}))"></a><div class="t" id="ttl">Teach It Back: <span>Bonds</span></div>
<button class="tb" id="pvBtn">PV Tables</button><button class="tb" id="aMinus">A−</button><button class="tb" id="aPlus">A+</button><button class="tb" id="homeBtn" style="display:none">↻ Rejoin</button></div>
<div class="wrap" id="app"></div>
<div class="sc" id="sc"></div>
<script>
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const fmt=n=>Math.round(n).toLocaleString("en-US");
const money=n=>"$"+fmt(n);
const r4=x=>Math.round(x*10000)/10000;
const pv1=(i,n)=>r4(Math.pow(1+i,-n));
const pva=(i,n)=>r4((1-Math.pow(1+i,-n))/i);
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const between=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
const HOST=params.has("host");
const NOTABLES=params.has("notables");
let FS=store.get("tibFS",1);
function setFS(v){FS=Math.max(.8,Math.min(1.6,v));document.documentElement.style.setProperty("--fs",FS);store.set("tibFS",FS)}
setFS(FS);
$("#aMinus").onclick=()=>setFS(FS-.1);$("#aPlus").onclick=()=>setFS(FS+.1);
if(NOTABLES)$("#pvBtn").style.display="none";

/* ================= schedule ================= */
const ROUNDS={
 r1:{name:"Find It on the PV Tables",short:"PV Table Lookup"},
 r2:{name:"Price the Bond",short:"Bond Pricing"},
 r3:{name:"Issue the Bonds",short:"Issuance Entry"},
 r4:{name:"Pay the Interest",short:"Interest Entry"},
 r5:{name:"How Much Interest?",short:"Interest Payments"},
 full:{name:"The Whole Deal",short:"Full Bond Process"}
};
const SCHED=[];
[["r1"],["r1"],["r2"],["r2"],["K",1],["D",1],["r3"],["r3"],["r4"],["r4"],["K",2],["D",2],["r5"],["r5"],["full"],["full"],["K",3],["D",3],["full"],["full"]].forEach(([t,k])=>{
  if(t==="K")SCHED.push({type:"kahoot",k,label:"Kahoot Break "+k});
  else if(t==="D")SCHED.push({type:"def",d:k,label:"Define It "+k});
  else{const rot=SCHED.filter(b=>b.type==="rot").length+1;SCHED.push({type:"rot",round:t,rot,teach:rot%2===1?"stay":"move",label:"Rotation "+rot})}
});
const MINUTES={rot:7,full:9,kahoot:5,def:7};
function blockMinutes(b){return b.type==="kahoot"?MINUTES.kahoot:b.type==="def"?MINUTES.def:(b.round==="full"?MINUTES.full:MINUTES.rot)}
const SCHED_NO=x=>x.type==="kahoot"?"Quiz "+x.k:x.type==="def"?"Def "+x.d:"Rot "+x.rot;
const SCHED_NAME=x=>x.type==="kahoot"?"Kahoot Break":x.type==="def"?"Define It":ROUNDS[x.round].short+(x.round!=="full"?(x.rot%2?" (A)":" (B)"):"");

/* ================= Define It bank =================
   The real answer is written the way a strong student would say it, so it doesn't stand out. */
const DEFS={
1:[{kind:"Define",term:"Market rate",real:"what investors could earn somewhere else right now, so it sets the bond's price"},
   {kind:"Explain",term:"Why do we use present value to price a bond?",real:"money later is worth less than money now, so you shrink future payments to today's value"}],
2:[{kind:"Define",term:"Premium on Bonds Payable",real:"the extra cash investors pay above face value, which adds to what the company owes"},
   {kind:"Define",term:"Federal funds rate",real:"the rate banks charge each other on overnight loans, which the Fed pushes up or down"}],
3:[{kind:"Define",term:"Carrying value",real:"what the bonds are worth on the books right now, slowly moving toward face value"},
   {kind:"Explain",term:"Why does a lower credit rating hurt a company selling bonds?",real:"investors want a higher rate for more risk, so the bonds sell for less cash"}]};
const DEF_RIGHT=50,DEF_FOOL=25;
function normDef(t){t=String(t||"").trim().replace(/\s+/g," ").replace(/[.!\s]+$/,"");return t?t.charAt(0).toUpperCase()+t.slice(1):""}
function defKey(b,p){return b+"_"+p}
function defEntries(recs,b,p,code,hide){
  const k=defKey(b,p),hid=(hide&&hide[k])||[];
  const list=Object.values(recs||{}).filter(r=>r&&r.def&&r.def[k]&&normDef(r.def[k].t)&&!hid.includes("s"+r.station)).map(r=>({id:"s"+r.station,station:r.station,text:normDef(r.def[k].t)}));
  list.push({id:"real",text:normDef(DEFS[SCHED[b].d][p].real)});
  return shuffle(rng((+code||1)*7+b*131+p*17),list.sort((a,c)=>a.id<c.id?-1:1))}
function defScores(recs,b,p,code,hide){
  const ents=defEntries(recs,b,p,code,hide),ids=ents.map(e=>e.id),pts={},votes={};ents.forEach(e=>votes[e.id]=0);
  Object.values(recs||{}).forEach(r=>{const d=r&&r.def&&r.def[defKey(b,p)];if(!d||!d.v||!ids.includes(d.v)||d.v==="s"+r.station)return;
    votes[d.v]++;if(d.v==="real")pts[r.station]=(pts[r.station]||0)+DEF_RIGHT;else{const st=+d.v.slice(1);pts[st]=(pts[st]||0)+DEF_FOOL}});
  return{pts,votes,ents}}

/* ================= check codes ================= */
function checkCode(station,blockIdx,pts){
  const s=`${station}|${blockIdx}|${pts}|bonds-tib`;let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  const A="ACDEFHJKLMNPRTUVWXY";let c="";for(let i=0;i<3;i++){c+=A[h%A.length];h=Math.floor(h/A.length)}return c}

/* ================= answer checking ================= */
function num(v){if(v==null)return NaN;v=String(v).replace(/[$,%\s]/g,"");if(v.startsWith("(")&&v.endsWith(")"))v="-"+v.slice(1,-1);return v===""?NaN:Number(v)}
function near(kind,val,ans){
  if(kind==="choice")return String(val||"").toLowerCase()===String(ans).toLowerCase();
  const x=num(val);if(isNaN(x))return false;
  if(kind==="int")return Math.round(x)===ans&&Math.abs(x-ans)<.01;
  if(kind==="rate"){return Math.abs(x-ans)<=.011||Math.abs(x*100-ans)<=.011}
  if(kind==="factor")return Math.abs(x-ans)<=Math.max(.0011,ans*.002);
  return Math.abs(x-ans)<=Math.max(2,Math.abs(ans)*.005); // money: any reasonable rounding
}
const ACCTS=["Cash","Bonds Payable","Discount on Bonds Payable","Premium on Bonds Payable","Bond Interest Expense","Interest Payable"];
function checkJE(rows,lines){
  // rows: [{acct,dr,cr}] entered. lines: [[acct,"Dr"/"Cr",amt]]
  const used=rows.filter(r=>r.acct||r.dr||r.cr);
  const res=rows.map(()=>false);let ok=used.length===lines.length;
  const remaining=lines.slice();
  rows.forEach((r,ix)=>{
    if(!(r.acct||r.dr||r.cr)){res[ix]=null;return}
    const side=num(r.dr)>0&&!(num(r.cr)>0)?"Dr":(num(r.cr)>0&&!(num(r.dr)>0)?"Cr":null);
    const amt=side==="Dr"?num(r.dr):num(r.cr);
    const k=remaining.findIndex(l=>l[0]===r.acct&&l[1]===side&&near("money",amt,l[2]));
    if(k>=0){res[ix]=true;remaining.splice(k,1)}else{res[ix]=false;ok=false}
  });
  if(remaining.length)ok=false;
  return{ok,res}
}

const COS=["Lakeview Logistics","Prairie Rail Co.","Summit Solar","Harbor Point Hotels","Northgate Grocers","Ridgeview Medical","Fox River Foods","Great Lakes Ferry","Cornbelt Seed Co.","Midway Air Freight","Riverbend Apartments","Maple Leaf Dairy","Crestview Health","Ironwood Builders","Bluewater Marine","Kingsley Sports","Arlington Auto Group","Windy City Bikes","Oak Park Bakery","Northline Airlines","Hersey Hill Water","Pioneer Steel","Redwood Outdoor","Silver Lake Resorts","Copper Canyon Mining","Evergreen Power","Lincoln Park Labs","Juniper Software","Starlight Theaters","Cascade Clinics"];
const PARS=[100000,200000,250000,300000,400000,500000,600000,750000,800000,1000000,1200000,1500000];

function makeBond(r,opts={}){
  const semi=opts.semi!=null?opts.semi:r()<.7;
  let years,i,mkt;
  if(semi){years=between(r,3,10);i=between(r,2,7);mkt=i*2}
  else{years=between(r,4,15);i=between(r,3,12);mkt=i}
  let call=opts.call||pick(r,["Discount","Premium","Discount","Premium","Par"]);
  let c;
  if(call==="Par")c=mkt;
  else if(call==="Discount")c=Math.max(1,mkt-pick(r,semi?[2,2,4]:[1,1,2]));
  else c=mkt+pick(r,semi?[2,2,4]:[1,1,2]);
  const par=opts.par||pick(r,PARS);
  const per=semi?2:1,n=years*per,iRate=i/100;
  const cash=Math.round(par*c/100/per);
  const f1=pv1(iRate,n),fa=pva(iRate,n);
  const pvPar=Math.round(par*f1),pvInt=Math.round(cash*fa),price=pvPar+pvInt;
  call=price>par?"Premium":price<par?"Discount":"Par";
  const diff=Math.abs(par-price),am=Math.round(diff/n);
  const exp=call==="Discount"?cash+am:call==="Premium"?cash-am:cash;
  const cv1=call==="Discount"?price+am:call==="Premium"?price-am:price;
  const cv2=call==="Discount"?price+2*am:call==="Premium"?price-2*am:price;
  return{co:opts.co||pick(r,COS),semi,years,mkt,c,par,per,n,i,cash,f1,fa,pvPar,pvInt,price,call,diff,am,exp,cv1,cv2,
    pay:semi?"semi-annually (June 30 and December 31)":"annually (December 31)",firstDate:semi?"June 30":"December 31"}
}
const bondFacts=b=>[["Face (par) value",money(b.par)],["Life",b.years+" years"],["Contract rate",b.c+"%"],["Market rate",b.mkt+"%"],["Interest paid",b.semi?"Semi-annually":"Annually"]];

function issueLines(b){
  if(b.call==="Par")return[["Cash","Dr",b.price],["Bonds Payable","Cr",b.par]];
  return b.call==="Discount"?[["Cash","Dr",b.price],["Discount on Bonds Payable","Dr",b.diff],["Bonds Payable","Cr",b.par]]
    :[["Cash","Dr",b.price],["Premium on Bonds Payable","Cr",b.diff],["Bonds Payable","Cr",b.par]]}
function interestLines(b){
  if(b.call==="Par")return[["Bond Interest Expense","Dr",b.cash],["Cash","Cr",b.cash]];
  return b.call==="Discount"?[["Bond Interest Expense","Dr",b.exp],["Discount on Bonds Payable","Cr",b.am],["Cash","Cr",b.cash]]
    :[["Bond Interest Expense","Dr",b.exp],["Premium on Bonds Payable","Dr",b.am],["Cash","Cr",b.cash]]}

const MAIN_COUNT={r1:3,r2:3,r3:2,r4:2,r5:3,full:1};
function buildSet(station,bIdx,round){
  const r=rng(station*7919+bIdx*104729+13);
  const probs=[];
  for(let k=0;k<MAIN_COUNT[round];k++){
    const which=(round==="r3"||round==="r4")?(k===0?(r()<.5?"Premium":"Discount"):null):null;
    let p=GEN[round](r,false,which);
    if(round==="r3"||round==="r4"){if(k===1){const first=probs[0].calltype;p=GEN[round](r,false,first==="Premium"?"Discount":"Premium")}}
    p.calltype=(p.text.match(/a <b>(discount|premium)/i)||[])[1];
    if(round==="r3")p.calltype=p.fields[1].label.startsWith("Premium")?"Premium":"Discount";
    if(round==="r4")p.calltype=/discount/i.test(p.text.match(/at a <b>\w+/)[0])?"Discount":"Premium";
    probs.push(p)
  }
  const bonus=GEN[round](r,true);
  return{probs,bonus}
}

function mockNet(){
  const KEY="tibLiveMock",bc=("BroadcastChannel" in window)?new BroadcastChannel(KEY):null,subs=[];
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
  const write=t=>{localStorage.setItem(KEY,JSON.stringify(t));fire();if(bc)bc.postMessage(1)};
  const at=(t,p)=>p.split("/").filter(Boolean).reduce((o,k)=>o==null?undefined:o[k],t);
  const put=(t,p,v)=>{const ks=p.split("/").filter(Boolean);let o=t;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||o[k]===null)o[k]={};o=o[k]});if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v};
  const fire=()=>{const t=read();subs.forEach(s=>{const v=JSON.stringify(at(t,s.p)??null);if(v!==s.last){s.last=v;s.cb(JSON.parse(v))}})};
  if(bc)bc.onmessage=fire;window.addEventListener("storage",e=>{if(e.key===KEY)fire()});
  return{kind:"mock",
    get:async p=>at(read(),p)??null,
    set:async(p,v)=>{const t=read();if(p.split("/").filter(Boolean).length===2&&at(t,p))throw new Error("Code in use");put(t,p,v);write(t)},
    update:async(p,o)=>{const t=read();Object.entries(o).forEach(([k,v])=>put(t,p+"/"+k,v));write(t)},
    remove:async p=>{const t=read();put(t,p,null);write(t)},
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.push(s);setTimeout(fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}};
}
async function vercelNet(){
  const call=async(op,path,v)=>{const r=await fetch("/api/live",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,path,v})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
  try{const p=await call("ping");if(!p.ok)return null}catch(e){return null}
  return{kind:"vercel",
    get:async p=>(await call("get",p)).v??null,
    set:(p,v)=>call("set",p,v),
    update:(p,o)=>call("update",p,o),
    remove:p=>call("remove",p),
    on:(p,cb)=>{let last,stop=false,t;
      const tick=async()=>{if(stop)return;
        if(!document.hidden){try{const v=(await call("get",p)).v??null,s=JSON.stringify(v);if(s!==last){last=s;cb(v)}}catch(e){}}
        if(!stop)t=setTimeout(tick,1500)};
      tick();return()=>{stop=true;clearTimeout(t)}}};
}

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function beep(f,d){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- who is where ---------- */
// Stayers never move. Movers slide up one station number every rotation (the last station wraps to Station 1).
// Kahoot breaks keep the pair from the rotation before.
function rotOf(bIdx){for(let i=bIdx;i>=0;i--)if(SCHED[i].type==="rot")return SCHED[i].rot;return 1}
function moverStartAt(station,rot,N){return((station-1-(rot-1))%N+N)%N+1}
function pairAt(recs,station,bIdx,N){
  const st=recs&&recs["s"+station];if(!st||!N)return null;
  const m=recs["s"+moverStartAt(station,rotOf(bIdx),N)];
  return{stay:[st.stay,st.stay2].filter(Boolean),move:m&&m.move?m.move:"(mover)"}}
function roster(recs){const n=[];Object.values(recs||{}).forEach(r=>{[r.stay,r.stay2,r.move].forEach(x=>{if(x&&!n.includes(x))n.push(x)})});return n}
function standings(recs,N){
  const tot={},tch={};roster(recs).forEach(n=>{tot[n]=0;tch[n]=0});
  const add=(n,p,t)=>{if(!(n in tot))return;tot[n]+=p;if(t)tch[n]+=p};
  Object.values(recs||{}).forEach(r=>{Object.entries(r.res||{}).forEach(([b,v])=>{b=+b;const blk=SCHED[b];const pts=(v&&v.pts)||0;if(!blk||!pts)return;
    const pr=pairAt(recs,r.station,b,N);if(!pr)return;
    if(blk.type==="kahoot"){pr.stay.forEach(n=>add(n,pts));add(pr.move,pts)}
    else if(blk.type==="rot"){const stayT=blk.teach==="stay";pr.stay.forEach(n=>add(n,stayT?pts*TEACH_X:pts,stayT));add(pr.move,stayT?pts:pts*TEACH_X,!stayT)}})});
  const G=(typeof H!=="undefined"&&H&&H.state)||{};
  (G.revealed||[]).forEach(k=>{const [b,p]=k.split("_").map(Number);if(!SCHED[b]||SCHED[b].type!=="def")return;
    const {pts}=defScores(recs,b,p,H.code,G.hide);
    Object.entries(pts).forEach(([st,v])=>{const pr=pairAt(recs,+st,b,N);if(!pr)return;pr.stay.forEach(n=>add(n,v));add(pr.move,v)})});
  return{tot,tch}}
function ranks(val){const ids=Object.keys(val).sort((a,b)=>val[b]-val[a]);const r={};let k=0,prev=null;ids.forEach((id,i)=>{if(val[id]!==prev){k=i+1;prev=val[id]}r[id]=k});return r}

/* ---------- hints ---------- */
// Hint 1 cuts what the problem is worth in half. Hint 2 cuts it to a quarter.
const HINT_MULT=[1,.5,.25];
function hintsHTML(){return `<div class="hintbox" id="hb"></div>`}
function mountHints(hints,base,used,onUse){
  const box=$("#hb");if(!box||!hints||!hints.length)return;
  const draw=()=>{const now=Math.round(base*HINT_MULT[used]);
    box.innerHTML=`<div class="worth">Worth now: <b>${now}</b> pts${used?` <span class="muted">(hints used: ${used})</span>`:""}</div>`+
      hints.slice(0,used).map((h,i)=>`<div class="hint"><b>Hint ${i+1}:</b> ${h}</div>`).join("")+
      (used<hints.length?`<button class="btn hbtn" id="hbtn">💡 Hint ${used+1}: drops this to ${Math.round(base*HINT_MULT[used+1])} pts</button>`:"");
    const b=$("#hbtn");if(b)b.onclick=()=>{used++;onUse(used);draw()}};

/* ---------- rotation ---------- */
const MAIN_PTS=100,BONUS_PTS=30;
function rotation(bIdx){
  const b=SCHED[bIdx],R=ROUNDS[b.round];
  const set=buildSet(ME.station,bIdx,b.round);
  let st=store.get(lkey(bIdx),null)||{pts:[],bonus:null,bonusPts:0,finished:false,idx:0,inBonus:false};
  const total=()=>st.pts.reduce((a,c)=>a+(c||0),0)+(st.bonusPts||0);
  const save=()=>{store.set(lkey(bIdx),st);pushResult(bIdx,{pts:total(),done:!!st.finished})};
  const per=Math.round(MAIN_PTS/set.probs.length);
  const live=()=>CUR&&CUR.block===bIdx;
  $("#ttl").innerHTML=`Station ${ME.station} · ${b.label}: <span>${R.name}</span>`;
  const nm=names(bIdx),stay=b.teach==="stay";
  const tName=stay?nm.stay.join(" & "):nm.move,lName=stay?nm.move:nm.stay.join(" & ");
  const roleHTML=()=>`<div class="role"><div class="te"><small>TEACHER · earns ${TEACH_X}× points</small><b>${esc(tName)}</b><small>${stay?"Stays here":"Just moved here"}. Coach on the whiteboard. Don't touch the iPad.</small></div>
    <div class="le"><small>LEARNER · earns 1× points</small><b>${esc(lName)}</b><small>${stay?"Just moved here":"Stays here"}. Work it out on the whiteboard, then type it in.</small></div></div>`;
  function draw(){
    if(!live())return;
    if(st.finished)return receipt();
    if(st.inBonus)return problem(set.bonus,true);
    if(st.idx>=set.probs.length)return mainDone();
    problem(set.probs[st.idx],false);
  }
  function progress(){return `<div class="prog">${set.probs.map((p,k)=>{const v=st.pts[k];return `<i class="${v==null?(k===st.idx?"on":""):v>=per?"ok":v>0?"half":"miss"}"></i>`}).join("")}<i class="${st.bonus==null?(st.inBonus?"on":""):st.bonus?"ok":"miss"}" style="background:${st.bonus==null&&!st.inBonus?"#f3dd9a":""}" title="Bonus"></i><span class="muted" style="margin-left:auto;font-size:.85em">So far: <b>${total()}</b> pts · teacher gets ${total()*TEACH_X}</span></div>`}
  function problem(p,isBonus){
    const worth=isBonus?BONUS_PTS:(st.idx===set.probs.length-1?MAIN_PTS-per*(set.probs.length-1):per);
    if(p.full)return fullProblem(p,worth);
    let tries=0;st.h=st.h||{};const hk=isBonus?"b":"p"+st.idx;let used=st.h[hk]||0;
    app.innerHTML=`${roleHTML()}<div class="panel">${progress()}
      <div class="work" style="${p.wide?"grid-template-columns:1fr":""}">
       <div class="prob"><div class="co">${isBonus?"BONUS: ":""}${p.title}${isBonus?'<span class="tag">+'+BONUS_PTS+' bonus</span>':""}</div><p>${p.text}</p>${p.facts?`<dl class="facts">${p.facts.map(([a,c])=>`<dt>${a}</dt><dd>${c}</dd>`).join("")}</dl>`:""}${hintsHTML()}</div>
       <div>${fieldsHTML(p.fields,p.wide)}${p.je?jeHTML(p.je):""}
        <div id="fb"></div><div class="acts"><button class="btn" id="chk">Check</button><button class="btn sec" id="nx" style="display:none">Next</button></div></div>
      </div></div>`;
    mountHints(p.hints,worth,used,u=>{used=u;st.h[hk]=u;store.set(lkey(bIdx),st)});
    $("#chk").onclick=()=>{
      tries++;const r=grade(p.fields,p.je);
      if(r.ok){const w=Math.round(worth*HINT_MULT[used]);const got=tries===1?w:Math.round(w/2);$("#hbtn")&&$("#hbtn").remove();
        $("#fb").innerHTML=`<div class="fb ok"><b>Correct! +${got} points${tries>1?" (second try)":""}.</b><br>${p.why}</div>`;finish(got)}
      else if(tries<2){$("#fb").innerHTML=`<div class="fb no"><b>Not yet.</b> The red boxes are off. Teacher: find the mistake on the whiteboard, then try once more for half points.</div>`}
      else{$("#hbtn")&&$("#hbtn").remove();showAnswers(p.fields,p.je);$("#fb").innerHTML=`<div class="fb show"><b>Here's how it works.</b> Teacher: walk through it before moving on.<br>${p.why}</div>`;finish(0)}
    };
    function finish(got){
      $("#chk").style.display="none";$("#nx").style.display="";
      if(isBonus){st.bonus=got>0;st.bonusPts=got}else{st.pts[st.idx]=got}

  }
  function fullProblem(p,worth){

      app.innerHTML=`${roleHTML()}<div class="panel">${progress()}<div class="steps">${p.stages.map((x,k)=>`<span class="${k<s?"ok":k===s?"on":""}">${x.name}</span>`).join("")}</div>
       <div class="work"><div class="prob"><div class="co">${p.title}</div><p>${p.text}</p><dl class="facts">${p.facts.map(([a,c])=>`<dt>${a}</dt><dd>${c}</dd>`).join("")}</dl>${s>0?`<p class="muted" style="font-size:.85em">Keep your earlier numbers on the whiteboard. You will need them.</p>`:""}${hintsHTML()}</div>
       <div>${fieldsHTML(sg.fields)}${sg.je?jeHTML(sg.je):""}<div id="fb"></div><div class="acts"><button class="btn" id="chk">Check</button><button class="btn sec" id="nx" style="display:none">Next step</button></div></div></div></div>`;
      mountHints(sg.hints,stageW,used,u=>{used=u;st.h[hk]=u;store.set(lkey(bIdx),st)});
      $("#chk").onclick=()=>{tries++;const r=grade(sg.fields,sg.je);
        if(r.ok){const w=Math.round(stageW*HINT_MULT[used]);const got=tries===1?w:Math.round(w/2);$("#hbtn")&&$("#hbtn").remove();earned+=got;$("#fb").innerHTML=`<div class="fb ok"><b>Correct! +${got}.</b><br>${sg.why}</div>`;fin()}

/* ---------- kahoot ---------- */
const KSEC=20,KMAX=10;
function kahoot(bIdx){
  const b=SCHED[bIdx];const live=()=>CUR&&CUR.block===bIdx;
  const nm=names(bIdx);const team=[...nm.stay,nm.move].map(esc).join(" & ");
  let st=store.get(lkey(bIdx),null);
  $("#ttl").innerHTML=`Station ${ME.station} · <span>${b.label}</span>`;
  const done=s=>{app.innerHTML=`<div class="panel center"><h2 style="font-size:32px;color:var(--k2)">Kahoot Break ${b.k} done</h2><p>${team}</p><div class="big" style="margin:10px 0">+${s.total} each</div><p class="muted">${s.right} of ${KAHOOT[b.k].length} right. Points are on the class scoreboard.</p></div>`};
  if(st&&st.finished)return done(st);
  const r=rng(ME.station*31+b.k*977);
  const qs=shuffle(r,KAHOOT[b.k]).map(([q,o,a])=>{const idx=shuffle(r,[0,1,2,3]);return{q,o:idx.map(i=>o[i]),a:idx.indexOf(a)}});
  let qi=(st&&st.qi)||0,total=(st&&st.total)||0,right=(st&&st.right)||0;
  const save=fin=>{const s={qi,total,right,finished:!!fin};store.set(lkey(bIdx),s);pushResult(bIdx,{pts:total,done:!!fin})};
  app.innerHTML=`<div class="panel center"><h1 style="font-size:46px;color:var(--k2)">Kahoot Break ${b.k}</h1><p style="font-size:1.25em"><b>${team}</b>, you're teammates now.</p><p>${qs.length} questions, ${KSEC} seconds each. Faster right answers earn more (up to ${KMAX} each), and you BOTH get the points.</p>
   <div class="acts" style="justify-content:center"><button class="btn" id="go" style="background:var(--k2);font-size:1.3em;padding:16px 40px">${qi?"Keep going":"Start"}</button></div></div>`;
  $("#go").onclick=ask;
  const SH=["▲","◆","●","■"];
  function ask(){
    if(!live())return;
    const q=qs[qi];let left=KSEC*10,answered=false;
    app.innerHTML=`<div class="panel"><div class="kmeta"><span>Question ${qi+1} of ${qs.length}</span><span id="tl">${KSEC}</span><span>${total} pts</span></div><div class="kbar"><i id="bar" style="width:100%"></i></div>
     <div class="kq">${q.q}</div><div class="kopts">${q.o.map((o,k)=>`<button class="kopt" data-k="${k}"><span class="sh">${SH[k]}</span><span>${o}</span></button>`).join("")}</div><div id="kf"></div></div>`;
    clearInterval(KTIMER);
    KTIMER=setInterval(()=>{if(!live()){clearInterval(KTIMER);return}left--;$("#bar").style.width=(left/(KSEC*10)*100)+"%";$("#tl").textContent=Math.ceil(left/10);if(left<=0)answer(-1)},100);
    app.querySelectorAll(".kopt").forEach(el=>el.onclick=()=>answer(+el.dataset.k));
    function answer(k){
      if(answered)return;answered=true;clearInterval(KTIMER);
      const ok=k===q.a;const got=ok?Math.round(KMAX/2+KMAX/2*Math.max(0,left)/(KSEC*10)):0;
      if(ok){total+=got;right++}qi++;save(qi>=qs.length);
      app.querySelectorAll(".kopt").forEach((el,ix)=>{if(ix===q.a)el.classList.add("right");else el.classList.add("dim")});
      $("#kf").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="font-size:1.2em"><b>${ok?"Correct! +"+got:k<0?"Time's up!":"Not this time."}</b>${ok?"":" The answer was: "+q.o[q.a]}</div><div class="acts" style="justify-content:center"><button class="btn" id="nk" style="background:var(--k2)">${qi<qs.length?"Next question":"See results"}</button></div>`;
      $("#nk").onclick=()=>{if(qi<qs.length)ask();else done({total,right})};
    }
  }
}

   <div><div class="panel"><h3 style="font-size:26px">Top 8 right now</h3><div id="top8"></div><p class="muted" style="font-size:15px;margin-top:6px">Teachers earn ${TEACH_X}× the points their pair scores. Learners, Kahoot teammates and Define It teams earn 1×.</p></div>
    <div class="panel"><h3>Schedule</h3><ul class="sched">${SCHED.map((x,ix)=>`<li data-i="${ix}" class="${ix===st.block?"on":""} ${x.type!=="rot"?"kk":""}"><span class="no">${SCHED_NO(x)}</span><span>${SCHED_NAME(x)}</span><span class="muted" style="margin-left:auto;font-size:14px">${blockMinutes(x)}m</span></li>`).join("")}</ul></div></div></div>`;
  app.querySelectorAll("[data-i]").forEach(li=>li.onclick=()=>{if(+li.dataset.i!==st.block&&confirm("Jump to "+SCHED[+li.dataset.i].label+"? Every iPad will switch."))goBlock(+li.dataset.i)});
  $("#prev").onclick=()=>{if(st.block>0&&confirm("Go back a block? Every iPad will switch."))goBlock(st.block-1)};
  $("#next").onclick=()=>last?setState({phase:"end"}):goBlock(st.block+1);
  $("#end").onclick=()=>{if(confirm("End the game now and show the final standings?"))setState({phase:"end"})};
  $("#stand").onclick=()=>{H.back=st.phase;fullStandings()};
  $("#tgo").onclick=()=>setState({timerEnd:Date.now()+blockMinutes(b)*60000,paused:null});
  $("#tpause").onclick=()=>{if(H.state.paused!=null)setState({timerEnd:Date.now()+H.state.paused,paused:null});else if(H.state.timerEnd)setState({paused:Math.max(0,H.state.timerEnd-Date.now()),timerEnd:0})};
  $("#tm1").onclick=()=>{if(H.state.paused!=null)setState({paused:Math.max(0,H.state.paused-60000)});else if(H.state.timerEnd)setState({timerEnd:H.state.timerEnd-60000})};
  $("#tp1").onclick=()=>{if(H.state.paused!=null)setState({paused:H.state.paused+60000});else if(H.state.timerEnd)setState({timerEnd:H.state.timerEnd+60000})};
  hostLiveBits();
  clearInterval(HTICK);let beeped=false;
  const paint=()=>{const el=$("#tm");if(!el){clearInterval(HTICK);return}const s=H.state;const ms=s.paused!=null?s.paused:s.timerEnd?s.timerEnd-Date.now():blockMinutes(b)*60000;el.textContent=mmss(ms/1000);el.classList.toggle("low",ms<60000);
    if(s.timerEnd&&ms<=0&&!beeped){beeped=true;beep(880,.3);setTimeout(()=>beep(660,.4),320)}};
  paint();HTICK=setInterval(paint,250);
}
function goBlock(i){setState({block:i,timerEnd:0,paused:null,dp:0,dph:"write"})}
function hostLiveBits(){
  const st=H.state;if(st.phase!=="play")return;
  const N=st.stations,{tot}=standings(H.recs,N),rk=ranks(tot);
  const order=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).slice(0,8);
  const t8=$("#top8");if(t8)t8.innerHTML=order.map(n=>`<div class="row" style="font-size:21px;padding:5px 0;border-bottom:1px solid #eee"><span class="osw" style="width:36px;color:var(--red)">${rk[n]}</span><span style="flex:1">${esc(n)}</span><b>${fmt(tot[n])}</b></div>`).join("")||`<p class="muted">No points yet.</p>`;
  const list=stationList(),dn=list.filter(r=>r.res&&r.res[st.block]&&r.res[st.block].done).length;
  const d=$("#done");if(d)d.innerHTML=`<b>${dn}</b> of ${list.length} stations finished this block`;
  if(SCHED[st.block].type==="def")hostDefBits();
  let warn=$("#latejoin");const max=list.length?list[list.length-1].station:0;
  if(max!==N||list.length!==N){
    if(!warn){warn=document.createElement("div");warn.id="latejoin";warn.className="panel";warn.style.cssText="border:3px solid var(--red);font-size:19px";app.prepend(warn)}
    warn.innerHTML=`<b style="color:var(--red)">The game started with ${N} stations, but ${list.length} have joined now.</b> Stations must be numbered 1 to ${list.length}. <button class="btn" id="fixN" style="margin-left:10px">Use ${list.length} stations</button> <span class="muted">Best done before Rotation 2. Changing it re-pairs who-moved-where for the whole game.</span>`;
    $("#fixN").onclick=()=>{if(confirm(`Switch the game to ${list.length} stations?`))setState({stations:list.length})}}
  else if(warn)warn.remove();
}
function hostDefBits(){
  const st=H.state,b=st.block,p=st.dp||0,ph=st.dph||"write",D=DEFS[SCHED[b].d][p],k=defKey(b,p),N=st.stations;
  const list=stationList(),box=$("#defLive"),ctl=$("#defCtl");if(!box)return;
  const head=`<div class="osw" style="font-size:20px;color:var(--red);letter-spacing:.15em">${D.kind.toUpperCase()} IT · PROMPT ${p+1} OF ${DEFS[SCHED[b].d].length}</div><div class="osw" style="font-size:52px;line-height:1.1;margin:4px 0 12px">${esc(D.term)}</div>`;
  if(ph==="write"){const n=list.filter(r=>r.def&&r.def[k]&&normDef(r.def[k].t)).length;
    box.innerHTML=head+`<p style="font-size:24px">Every team writes the best ${D.kind==="Explain"?"explanation":"definition"} they can. <b>${n}</b> of ${list.length} teams have locked in.</p><p class="muted" style="font-size:19px">Then everyone votes for the real one. +${DEF_RIGHT} for picking the real one, +${DEF_FOOL} for every team that picks yours.</p>`;
    if(!$("#dgo")){ctl.innerHTML=`<button class="btn" id="dgo">Start voting ▶</button>`;$("#dgo").onclick=()=>setState({dph:"vote"})}
    return}
  const ents=defEntries(H.recs,b,p,H.code,st.hide);
  const nm=e=>{if(e.id==="real")return "";const pr=pairAt(H.recs,e.station,b,N);return pr?[...pr.stay,pr.move].map(esc).join(" & "):"Station "+e.station};
  if(ph==="vote"){const nv=list.filter(r=>r.def&&r.def[k]&&r.def[k].v).length;
    box.innerHTML=head+`<div class="dlist">${ents.map((e,i)=>`<div class="dent"><span class="osw">${String.fromCharCode(65+i)}</span><span>${esc(e.text)}</span>${e.id!=="real"?`<button class="btn hd" data-hide="${e.id}" title="Hide this answer">Hide</button>`:`<span class="hd" style="visibility:hidden">Hide</span>`}</div>`).join("")}</div><p style="font-size:22px;margin-top:10px"><b>${nv}</b> of ${list.length} teams have voted.</p>`;
    box.querySelectorAll("[data-hide]").forEach(bt=>bt.onclick=()=>{if(!confirm("Hide this answer? Votes for it won't count."))return;const hide={...(st.hide||{})};hide[k]=[...(hide[k]||[]),bt.dataset.hide];setState({hide})});
    if(!$("#drev")){ctl.innerHTML=`<button class="btn" id="drev">Reveal the real one ▶</button>`;$("#drev").onclick=()=>setState({dph:"reveal",revealed:[...new Set([...(H.state.revealed||[]),k])]})}
    return}
  const {votes}=defScores(H.recs,b,p,H.code,st.hide);
  box.innerHTML=head+`<div class="dlist">${ents.map((e,i)=>`<div class="dent ${e.id==="real"?"real":""}"><span class="osw">${String.fromCharCode(65+i)}</span><span>${esc(e.text)}<div class="by">${e.id==="real"?"✓ THE REAL ANSWER":"Written by "+nm(e)}</div></span><span class="vc">${votes[e.id]||0} vote${votes[e.id]===1?"":"s"}</span></div>`).join("")}</div>`;
  const more=p<DEFS[SCHED[b].d].length-1;
  if(more&&!$("#dnx")){ctl.innerHTML=`<button class="btn" id="dnx">Next prompt ▶</button>`;$("#dnx").onclick=()=>setState({dp:p+1,dph:"write",timerEnd:0,paused:null})}
  if(!more)ctl.innerHTML=`<span class="muted" style="font-size:19px">Last prompt. Click <b>Next block</b> when you're ready.</span>`;
}
function fullStandings(){
  stopFireworks();
  const N=H.state.stations,{tot,tch}=standings(H.recs,N),rk=ranks(tot);
  const order=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
  const half=Math.ceil(order.length/2);
  const col=arr=>`<table class="pvt" style="font-size:20px"><tr><th>#</th><th style="text-align:left">Student</th><th>Total</th><th>From teaching</th></tr>${arr.map(n=>`<tr><td>${rk[n]}</td><td style="text-align:left">${esc(n)}</td><td><b>${fmt(tot[n])}</b></td><td>${fmt(tch[n])}</td></tr>`).join("")}</table>`;
  app.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h1 style="font-size:40px">Standings</h1><div class="row"><button class="btn sec" id="csv">Download scores</button><button class="btn" id="bk">Back</button></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px">${col(order.slice(0,half))}${col(order.slice(half))}</div></div>`;
  $("#bk").onclick=()=>{if(H.state.phase==="end")finale();else hostRender(true)};
  $("#csv").onclick=()=>{const rows=[["Rank","Student","Total","From teaching"],...order.map(n=>[rk[n],n,tot[n],tch[n]])];
    const blob=new Blob([rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`teach-it-back-${H.code}.csv`;a.click()};
}
/* ---------- finale (5th to 1st, slow, with room for applause) ---------- */
function fanfare(){[[523,0],[659,.12],[784,.24],[1047,.4]].forEach(([f,t])=>setTimeout(()=>beep(f,.35),t*1000))}
let FW=null,FIN=[];
function stopFireworks(){FIN.forEach(clearTimeout);FIN=[];if(FW){cancelAnimationFrame(FW.raf);FW=null}document.body.classList.remove("finale-on")}
function startFireworks(on){
  const cv=$("#fw");if(!cv)return;const cx=cv.getContext("2d");if(FW)cancelAnimationFrame(FW.raf);
  const dpr=Math.min(2,devicePixelRatio||1);const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr};size();addEventListener("resize",size);
  const COLS=["#C1102F","#E8193C","#FFFFFF","#FFFFFF","#D9D9D9","#C1102F"];
  const rockets=[],parts=[];const t0=performance.now();
  const launch=()=>{const W=cv.width,Hh=cv.height;rockets.push({x:W*(.12+Math.random()*.76),y:Hh,vx:(Math.random()-.5)*1.2*dpr,vy:-(Hh*.0125+Math.random()*Hh*.004),ty:Hh*(.12+Math.random()*.35),c:COLS[Math.floor(Math.random()*COLS.length)]})};
  const burst=(r)=>{const n=70+Math.floor(Math.random()*40),sp=(2.2+Math.random()*2.2)*dpr,ring=Math.random()<.35;
    for(let k=0;k<n;k++){const a=Math.PI*2*k/n+Math.random()*.1,v=ring?sp:sp*(.35+Math.random()*.75);parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.008+Math.random()*.01,c:Math.random()<.25?"#FFFFFF":r.c,s:(1.6+Math.random()*1.4)*dpr})}};
  FW={raf:0};
  const frame=(now)=>{if(!FW)return;const el=now-t0;
    const rate=el<7000?260:el<20000?900:1800;
    if(on&&now-(FW.lastL||0)>rate){FW.lastL=now;launch();if(el<7000&&Math.random()<.5)launch()}
    cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.22)";cx.fillRect(0,0,cv.width,cv.height);cx.globalCompositeOperation="lighter";
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.09*dpr;cx.fillStyle=r.c;cx.beginPath();cx.arc(r.x,r.y,2.2*dpr,0,7);cx.fill();if(r.y<=r.ty||r.vy>=0){burst(r);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.045*dpr;p.life-=p.d;if(p.life<=0){parts.splice(i,1);continue}
      cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()}
    cx.globalAlpha=1;FW.raf=requestAnimationFrame(frame)};
  if(!on){[0,1,2].forEach(()=>{launch()});rockets.forEach(r=>{r.y=r.ty;burst(r)});rockets.length=0;parts.forEach(p=>{p.x+=p.vx*25;p.y+=p.vy*25});
    cx.globalCompositeOperation="lighter";parts.forEach(p=>{cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()});return}
  FW.raf=requestAnimationFrame(frame);
}
function finale(){
  clearInterval(HTICK);
  const N=H.state.stations,{tot}=standings(H.recs,N),rk=ranks(tot);
  const order=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]),top=order.slice(0,5);
  const slot=(n,i,cls)=>n?`<div class="pod ${cls}" data-i="${i}"><div class="who"><div class="medal">${rk[n]}</div><div class="nm">${esc(n)}</div><div class="pts">${fmt(tot[n])} pts</div></div><div class="block"><span>${["1st","2nd","3rd"][i]}</span></div></div>`:`<div class="pod ${cls} empty"></div>`;
  const rows=top.slice(3).map((n,k)=>`<div class="row45" data-i="${k+3}"><span class="r">${rk[n]}</span><span class="n">${esc(n)}</span><span class="s">${fmt(tot[n])}</span></div>`).join("");
  document.body.classList.add("finale-on");
  app.innerHTML=`<div class="finale"><canvas id="fw"></canvas><div class="rays"></div>
    <div class="fhead"><img class="lg" src="/logo-214.png" alt="District 214"><div class="kick">Teach It Back · Bonds</div><h2>Final standings</h2></div>
    <div class="podium">${slot(order[1],1,"p2")}${slot(order[0],0,"p1")}${slot(order[2],2,"p3")}</div><div class="rest">${rows}</div>
    <div class="fbar"><button class="btn" id="cr">All standings</button><button class="btn" id="again">Replay</button><button class="btn" id="resumeG">Back to the game</button><button class="btn" id="erase">Erase game</button></div></div>`;
  $("#cr").onclick=()=>fullStandings();$("#again").onclick=()=>{stopFireworks();finale()};$("#erase").onclick=()=>{stopFireworks();hostErase()};
  $("#resumeG").onclick=()=>{stopFireworks();setState({phase:"play"})};
  const ord5=[4,3,2,1,0].filter(i=>order[i]),at=[2000,7000,12500,18000,24500];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  FIN.forEach(clearTimeout);FIN=ord5.map((i,n)=>setTimeout(()=>{const el=app.querySelector(`.finale [data-i="${i}"]`);if(!el)return;el.classList.add("in");if(i===0){fanfare();startFireworks(!reduce)}else beep(i<3?660:520,.12)},at[n+(5-ord5.length)]||at[n]));
}
async function hostErase(){if(!confirm("Erase this game and all its scores?"))return;try{H.off&&H.off();await H.N.remove("games/"+H.code)}catch(e){}try{localStorage.removeItem(HKEY)}catch(e){}H=null;stopFireworks();hostSetup()}

function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
/* ---------- start ---------- */
if(ROLE==="teacher"){$("#pvBtn").style.display="none";app.style.maxWidth="1700px";$("#homeBtn").style.display="none";hostSetup()}
else{const s=store.get(SKEY,null);if(s&&s.code&&s.station){ME=s;startStation()}else joinForm()}

</script>
