<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Underwriting Desk | Bonds</title>
<meta name="description" content="Bonds class game for District 214 Accounting: underwriting desks price bonds with present value tables, book the issuance and interest entries, and track the discount or premium.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2;--paper:#FFFFFF;--ink:#111111;--muted:#5C5C5C;--line:rgba(17,17,17,.14);--soft:#F4F4F4;--dark:#111111;
  --red:#C1102F;--good:#1E7A3C;--goodsoft:#E7F4EB;--bad:#C1102F;--badsoft:#FBE7EA;--warn:#9A6700;--warnsoft:#FFF4D6;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:12px 18px 28px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;font-weight:600}
.top img{height:34px;width:auto;border-radius:3px;display:block}
.top a{color:inherit;text-decoration:none}
.sp{flex:1}
.pill{background:var(--dark);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.rejoin{background:var(--red);color:#fff;border:0;border-radius:999px;padding:7px 16px;font:700 16px var(--body);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.zm{display:inline-flex;gap:4px}
.zm button{background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:700;font-size:15px}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.5vw,72px);line-height:.98;margin:18px 0 6px}
h1.title span{color:var(--red)}
.lede{max-width:66ch;color:var(--muted);margin:0 0 18px}
.btn{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:700;font-size:17px}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--display);font-weight:600;font-size:24px;padding:10px 30px}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:680px;margin:10px auto 0}
.panel h2{font-family:var(--display);font-weight:600;font-size:32px;margin:0 0 6px}
.panel ol{padding-left:22px;margin:6px 0 10px}.panel li{margin:3px 0}
.field{display:block;width:100%;font-size:26px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--soft);margin:6px 0 14px;font-family:var(--body);color:var(--ink)}
.field.code{letter-spacing:.3em;text-align:center;font-family:var(--display);font-size:40px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.note{font-size:15px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wait{text-align:center;padding:40px 10px}
.wait h2{font-family:var(--display);font-size:clamp(32px,6vw,54px);margin:0 0 8px;line-height:1.05}
.wait p{color:var(--muted);font-size:20px;max-width:46ch;margin:6px auto}
.num{font-variant-numeric:tabular-nums}

/* lobby */
.lobby{text-align:center}
.lobtop{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,60px);flex-wrap:wrap}
.lobleft{max-width:700px;flex:1 1 420px}
.lobby .join{font-size:clamp(20px,2.4vw,30px);color:var(--muted);font-weight:600}
.lobby .code{font-family:var(--display);font-weight:700;font-size:clamp(80px,14vw,170px);line-height:1;letter-spacing:.12em;margin:6px 0}
.lobby .url{font-weight:700;color:var(--muted);font-size:clamp(14px,1.4vw,20px);word-break:break-all}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);border:2px solid var(--line)}
.qr svg{width:clamp(180px,22vw,320px);height:auto;display:block}
.qr span{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#111;font-size:clamp(14px,1.4vw,20px)}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.names span{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--c,#111);border-radius:999px;padding:6px 16px;font-weight:700;font-size:22px}
.count{font-family:var(--display);font-size:24px;font-weight:600}

/* projector stage */
.rhead{display:flex;align-items:baseline;gap:14px;margin:6px 0 10px;flex-wrap:wrap}
.rtag{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-size:22px}
.rname{font-family:var(--display);font-weight:600;font-size:22px;color:var(--muted)}
.yr{margin-left:auto;background:var(--dark);color:#fff;border-radius:8px;padding:2px 12px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em}
.scard{background:var(--paper);border:2px solid var(--line);border-left:12px solid var(--red);border-radius:14px;padding:18px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.stitle{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;margin:0 0 8px}
.story{font-size:27px;line-height:1.35;margin:0}
.lesson{margin-top:12px;background:var(--goodsoft);border-left:8px solid var(--good);border-radius:10px;padding:12px 18px;font-size:22px}
.lesson b{font-family:var(--display);font-weight:600;font-size:24px}
.ask{font-family:var(--display);font-size:28px;font-weight:600;margin:14px 0 4px;text-align:center}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;background:var(--paper);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:12px;padding:8px 12px 10px;min-height:96px}
.tile .tn{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.tile .rk{position:absolute;top:6px;right:10px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:18px}
.tile .lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tile .cash{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .st{font-weight:700;font-size:16px;line-height:1.25}
.tile.ok{background:var(--goodsoft);border-color:var(--good);border-top-color:var(--c)}
.tile.no{background:var(--badsoft);border-color:var(--bad);border-top-color:var(--c)}
.tile.mid{background:var(--warnsoft);border-color:var(--warn);border-top-color:var(--c)}
.stamp{display:inline-block;border-radius:6px;padding:1px 8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;color:#fff;margin-right:6px;background:var(--dark)}
.tile.ok .stamp{background:var(--good)} .tile.no .stamp{background:var(--bad)} .tile.mid .stamp{background:var(--warn)}
.tile.wait .st{color:var(--muted)} .tile.done .st{color:var(--good)}
.tile.anim{animation:tin .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d,0ms)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bar2 .row{margin-left:auto}
.applist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.appchip{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:19px;display:flex;justify-content:space-between;gap:10px}
.appchip b{font-family:var(--display);font-weight:600}
.arows{display:grid;gap:6px;margin-top:10px}
.arow{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-size:21px}
.arow b{font-family:var(--display);font-weight:600;font-size:23px}
.arow .b{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}.arow .b i{display:block;height:100%;background:var(--red)}
.arow.anim{animation:tin .45s both;animation-delay:var(--d,0ms)}
.pct{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.pct div{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:17px;font-weight:600;line-height:1.2}
.pct b{display:block;font-family:var(--display);font-size:34px;color:var(--red)}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-top:12px}
.newsc{background:var(--paper);border:2px solid var(--line);border-top:8px solid var(--bad);border-radius:12px;padding:12px 16px}
.newsc.good{border-top-color:var(--good)} .newsc.mix{border-top-color:var(--warn)}
.newsc b{font-family:var(--display);font-weight:600;font-size:26px;display:block;line-height:1.1}
.newsc p{margin:4px 0 0;font-size:20px}
.newsc.anim{animation:tin .45s both;animation-delay:var(--d,0ms)}
.jrn{display:inline-grid;grid-template-columns:auto auto auto;gap:0 22px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 16px;font-size:21px;margin:6px 10px 0 0;vertical-align:top;font-variant-numeric:tabular-nums}
.jrn>span{white-space:nowrap}.jrn .ci{padding-left:34px}.jrn .d{text-align:right;min-width:4ch}
.huddle .btn{color:var(--ink)}
.jrn .h{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:22px;line-height:1.3}
.opt .sh{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--dark);color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.opt .ent{display:block;font-variant-numeric:tabular-nums}
.opt .ent .c{padding-left:28px;display:block}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.right{border-color:var(--good);background:var(--goodsoft)} .opt.right .sh{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)} .opt.wrong .sh{background:var(--bad)}
.opt .tally{margin-left:auto;font-family:var(--display);font-weight:700;font-size:26px;white-space:nowrap}
.timer{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.timer.done{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.huddle{background:var(--dark);color:#fff;border-radius:16px;padding:22px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.huddle .kick{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:#FF4D63;font-size:20px}
.huddle h2{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.05;margin:2px 0 8px}
.huddle p{font-size:28px;line-height:1.35;margin:0}
.huddle .hint{font-size:21px;color:#ccc;margin-top:10px}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}
.ans{position:relative;background:var(--paper);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:12px;padding:12px 16px 12px;text-align:left;font-size:20px;line-height:1.35}
.ans .who{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ans .txt{margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.ans .acts{display:flex;gap:8px}
.ans .acts button{font-size:15px;padding:4px 12px}
.ans.star{border-color:var(--good);background:var(--goodsoft)}
.ans.anim{animation:tin .45s both;animation-delay:var(--d,0ms)}
.ans .medal{background:var(--good);color:#fff;border-radius:6px;padding:0 8px;font-size:16px}
.spot{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.92);display:grid;place-items:center;padding:4vh 6vw;cursor:pointer}
.spot div{background:var(--paper);border-radius:20px;border-left:16px solid var(--c);padding:4vh 4vw;max-width:1400px}
.spot b{font-family:var(--display);font-weight:600;font-size:clamp(24px,4vh,44px);color:var(--muted);display:block}
.spot p{font-size:clamp(30px,5.4vh,66px);line-height:1.25;margin:1vh 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* team device (iPad) */
.tbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:2px solid var(--line);margin-bottom:12px}
.mtext{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:20px;flex-wrap:wrap}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.appc{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.appc.yes{border-color:var(--good);background:var(--goodsoft)} .appc.noo{border-color:var(--bad);background:var(--badsoft)}
.appc .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.appc .hd b{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1}
.appc .amt{font-family:var(--display);font-weight:700;font-size:26px;white-space:nowrap}
.appc .what{color:var(--muted);font-size:17px;margin-top:-4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:17px;margin:2px 0}
.facts dt{color:var(--muted);font-weight:600}.facts dd{margin:0;font-weight:700}
.quote{font-size:17px;font-style:italic;background:var(--soft);border-radius:8px;padding:6px 10px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:4px}
.yn button{border:3px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;font-family:var(--display);font-weight:600;font-size:22px}
.yn .y[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.yn .n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.lock{position:sticky;bottom:0;background:var(--bg);padding:12px 0;margin-top:12px;border-top:2px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips span{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
.chips .g{border-color:var(--good);background:var(--goodsoft)} .chips .r{border-color:var(--bad);background:var(--badsoft)} .chips .y{border-color:var(--warn);background:var(--warnsoft)}
.verdict{border-radius:16px;padding:20px;text-align:center;margin:10px auto;max-width:760px}
.verdict.ok{background:var(--goodsoft);border:3px solid var(--good)} .verdict.no{background:var(--badsoft);border:3px solid var(--bad)} .verdict.mid{background:var(--warnsoft);border:3px solid var(--warn)} .verdict.neu{background:var(--paper);border:3px solid var(--line)}
.verdict h2{font-family:var(--display);font-size:clamp(36px,7vw,64px);margin:0;line-height:1.05}
.verdict.ok h2{color:var(--good)} .verdict.no h2{color:var(--bad)} .verdict.mid h2{color:var(--warn)}
.verdict p{font-size:20px;margin:8px 0 0}
.box{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px auto;max-width:760px}
.box h3{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 6px}
.cashline{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:12px;font-weight:700;font-size:20px}
.cashline b{font-family:var(--display);font-size:40px;display:block;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:4px 6px}
table.t td{border-bottom:1px solid var(--line);padding:6px}
table.t td.r,table.t th.r{text-align:right}
table.t tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.inp{width:100%;min-width:90px;font:600 20px var(--body);padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--soft);text-align:right;color:var(--ink)}
.inp.big{font-size:28px;padding:10px 12px}
.taccount{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--ink);margin-top:6px;font-size:18px;font-variant-numeric:tabular-nums}
.taccount>div{padding:4px 10px}.taccount>div:first-child{border-right:3px solid var(--ink)}
.taccount .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.taccount .hd{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ans2{display:grid;grid-template-columns:1fr 220px;gap:10px 14px;align-items:center;margin-top:8px;font-size:19px;font-weight:600}
.rule{background:var(--dark);color:#fff;border-radius:12px;padding:10px 16px;margin-bottom:12px;font-size:18px}
.rule b{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#FF8A9A;font-size:15px;display:block}
textarea.field{font-size:22px;min-height:170px;resize:vertical;line-height:1.35}
.bs{display:grid;grid-template-columns:1fr auto auto;gap:2px 18px;font-size:19px;font-variant-numeric:tabular-nums}
.bs .u{border-bottom:2px solid var(--ink)} .bs .tot{font-weight:700}
.rep h2{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,54px);margin:6px 0;line-height:1.05}
.leak{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--bad);border-radius:12px;padding:10px 16px;margin:8px 0;font-size:18px}
.leak b{font-family:var(--display);font-weight:600;font-size:21px;display:block}
.leak.okk{border-left-color:var(--good)} .leak.mid{border-left-color:var(--warn)}
.cr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 1fr auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:19px}
.cr .b{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}.cr .b i{display:block;height:100%;background:var(--red)}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-weight:700;font-size:15px;color:#fff;background:var(--good)}
.tag.r{background:var(--bad)}.tag.y{background:var(--warn)}.tag.k{background:var(--dark)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:12px 14px}
.mode b{font-family:var(--display);font-weight:600;font-size:22px}
.mode span{font-size:15px;color:var(--muted);line-height:1.3}
.mode[aria-pressed="true"]{border-color:var(--red);background:#FBE7EA}
.appwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.rkey{position:sticky;top:96px;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px 14px}
.rkey h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 2px;line-height:1.1}
.rkey .sub{font-size:14px;color:var(--muted);margin:0 0 8px;line-height:1.25}
.rk{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--line)}
.rk b{font-family:var(--display);font-weight:700;font-size:20px;text-align:center;color:#fff;border-radius:6px;padding:1px 0;background:var(--c)}
.rk span{font-size:13.5px;line-height:1.18}
.rk span strong{display:block;font-size:15.5px}

<script>
"use strict";
/* ============================================================ HELPERS */
const $=s=>document.querySelector(s);
const app=$("#app");
const money=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const plain=n=>Math.abs(Math.round(n)).toLocaleString("en-US");
const signed=n=>(n>0?"+":n<0?"−":"±")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");

const ord=n=>n+(n%100>=11&&n%100<=13?"th":["th","st","nd","rd"][n%10]||"th");
const sum=a=>a.reduce((t,x)=>t+x,0);
function num(s){if(s==null)return NaN;let t=String(s).trim().replace(/[$,%\s]/g,"");if(!/^-?\d+(\.\d+)?$/.test(t))return NaN;return Math.round(+t*100)/100}
function beep(f,d){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const ROLE=window.UW_ROLE||"team";
const MOCK=/[?&]mock=1/.test(location.search);

/* ============================================================ GAME CONTENT
   Class math rules: PV factors rounded to 4 decimals, each PV piece = factor x amount rounded to the dollar,
   price = sum of the pieces, straight-line amortization = discount or premium / periods rounded to the dollar. */
const GAME="underwriting",FIRM="Lakefront Capital";
const MC_PTS=200,MANDATE=[300,200,100];
const SPREADS=[["AAA","+1.5%"],["AA","+2%"],["A","+3%"],["BBB","+4%"],["BB","+5%"]];
const DEALS=[
 {id:"d1",co:"Prairie Rail Freight",what:"New locomotives for its Chicago to Denver line",rating:"A",par:500000,c:9,yrs:15,tr:6,sp:3,
  news:{h:"A quiet week in the bond market",p:"Nothing moved. The 15-year Treasury still yields 6%, and A-rated companies pay 3% more than the Treasury."},
  why:"The bond pays exactly what investors demand, so they pay exactly face value. No discount, no premium.",
  steps:["price","issue"]},
 {id:"d2",co:"Summit Solar Co.",what:"A solar farm outside Peoria",rating:"A",par:1000000,c:6,yrs:5,tr:5,sp:3,
  news:{h:"The Fed raises rates",p:"Summit Solar printed 6% on its bonds last month. Since then the 5-year Treasury jumped to 5%, and A-rated companies pay 3% more."},
  why:"Investors can now earn 8% elsewhere. A 6% bond only sells if they can buy it for less than face value.",
  steps:["price","issue","interest","intEntry"]},
 {id:"d3",co:"Harbor Point Hotels",what:"A lakefront hotel renovation",rating:"AA",par:800000,c:10,yrs:8,tr:6,sp:2,
  news:{h:"Rates fall",p:"Harbor Point printed 10% on its bonds when rates were high. The 8-year Treasury has dropped to 6%, and AA-rated companies pay 2% more."},
  why:"The bond pays 10% when the market only asks 8%. Investors compete for it and pay more than face value.",
  steps:["price","issue","interest"]},
 {id:"d4",co:"Northgate Grocers",what:"Twelve new stores across the suburbs",rating:"BB",was:"A",par:600000,c:8,yrs:10,tr:5,sp:5,
  news:{h:"Good news, bad news",p:"The 10-year Treasury fell to 5%. But Northgate had a weak year and its rating was cut from A to BB. BB companies pay 5% more than the Treasury."},
  why:"Lower Treasury rates helped, but the rating cut hurt more. Investors want 10% from a BB company, so the 8% bond sells at a discount.",
  steps:["price","interest","carry"],k:2},
 {id:"d5",co:"Ridgeview Medical Center",what:"A new children's hospital wing",rating:"AAA",par:2000000,c:8,yrs:10,tr:4.5,sp:1.5,
  news:{h:"Final deal: the biggest client of the year",p:"Ridgeview is rated AAA. The 10-year Treasury yields 4.5%, and AAA borrowers pay only 1.5% more."},
  why:"Ridgeview is so safe that investors accept 6%. An 8% bond is worth more than face value to them.",
  steps:["price","interest","bs"],k:4}

const r4=x=>Math.round(x*10000)/10000;
const pv1=(i,n)=>r4(Math.pow(1+i/100,-n)),pva=(i,n)=>r4((1-Math.pow(1+i/100,-n))/(i/100));
function calc(d){const m=d.tr+d.sp,n=d.yrs*2,i=m/2,cash=Math.round(d.par*d.c/100/2),f1=pv1(i,n),fa=pva(i,n),A=Math.round(d.par*f1),B=Math.round(cash*fa),price=A+B,diff=price-d.par,
  am=Math.round(Math.abs(diff)/n),exp=diff<0?cash+am:cash-am,call=diff<0?"Discount":diff>0?"Premium":"Par",k=d.k||0,left=Math.abs(diff)-k*am,cv=diff<0?d.par-left:d.par+left;
  return{m,n,i,cash,f1,fa,A,B,price,diff,am,exp,call,k,left,cv}}
DEALS.forEach(d=>d.x=calc(d));
const pct=v=>(Math.round(v*100)/100)+"%";
const fmt=n=>Math.round(n).toLocaleString("en-US");
const ENT=(lines)=>lines.map(([s,a,v])=>[s,a,fmt(v)]);
/* multiple choice entry checks; the right answer sits at the given position */
function issueMC(d){const x=d.x,P=d.par,pr=x.price,df=Math.abs(x.diff);
  if(x.call==="Par")return{q:`January 1: ${d.co} issues its ${money(P)}, ${d.c}%, ${d.yrs}-year bonds at face value. Which entry?`,pos:2,
    opts:[ENT([["Dr","Cash",P],["Cr","Bonds Payable",P]]),ENT([["Dr","Bonds Payable",P],["Cr","Cash",P]]),ENT([["Dr","Cash",P+x.cash],["Cr","Bonds Payable",P+x.cash]]),ENT([["Dr","Cash",P],["Cr","Bond Interest Expense",P]])],
    why:`At par the cash raised equals face value. Interest isn't recorded until it's paid on June 30.`};
  if(x.call==="Discount")return{q:`January 1: ${d.co} issues its ${money(P)}, ${d.c}%, ${d.yrs}-year bonds for ${money(pr)}. Which entry?`,pos:1,
    opts:[ENT([["Dr","Cash",pr],["Dr","Discount on Bonds Payable",df],["Cr","Bonds Payable",P]]),ENT([["Dr","Cash",pr],["Cr","Bonds Payable",pr]]),ENT([["Dr","Cash",P],["Cr","Discount on Bonds Payable",df],["Cr","Bonds Payable",pr]]),ENT([["Dr","Cash",pr],["Dr","Bond Interest Expense",df],["Cr","Bonds Payable",P]])],
    why:`Bonds Payable is always recorded at face value. The ${money(df)} gap is a debit to Discount on Bonds Payable, a contra-liability.`};
  return{q:`January 1: ${d.co} issues its ${money(P)}, ${d.c}%, ${d.yrs}-year bonds for ${money(pr)}. Which entry?`,pos:3,
    opts:[ENT([["Dr","Cash",pr],["Cr","Premium on Bonds Payable",df],["Cr","Bonds Payable",P]]),ENT([["Dr","Cash",pr],["Cr","Bonds Payable",pr]]),ENT([["Dr","Cash",P],["Dr","Premium on Bonds Payable",df],["Cr","Bonds Payable",pr]]),ENT([["Dr","Cash",pr],["Cr","Bond Interest Expense",df],["Cr","Bonds Payable",P]])],
    why:`Bonds Payable is always recorded at face value. The extra ${money(df)} is a credit to Premium on Bonds Payable, which adds to the liability.`};
}
function intMC(d){const x=d.x,am=x.am,dis=x.call==="Discount",acct=dis?"Discount on Bonds Payable":"Premium on Bonds Payable";
  return{q:`June 30: ${d.co} makes its first interest payment of ${money(x.cash)} and amortizes the ${dis?"discount":"premium"} straight-line. Which entry?`,pos:2,
    opts:[ENT(dis?[["Dr","Bond Interest Expense",x.exp],["Cr",acct,am],["Cr","Cash",x.cash]]:[["Dr","Bond Interest Expense",x.exp],["Dr",acct,am],["Cr","Cash",x.cash]]),
      ENT([["Dr","Bond Interest Expense",x.cash],["Cr","Cash",x.cash]]),

function mockNet(){
  const KEY="bankRecLiveMock",bc=("BroadcastChannel" in window)?new BroadcastChannel(KEY):null,subs=[];
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
  const write=t=>{localStorage.setItem(KEY,JSON.stringify(t));fire();if(bc)bc.postMessage(1)};
  const at=(t,p)=>p.split("/").filter(Boolean).reduce((o,k)=>o==null?undefined:o[k],t);
  const put=(t,p,v)=>{const ks=p.split("/").filter(Boolean);let o=t;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||o[k]===null)o[k]={};o=o[k]});if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v};
  const fire=()=>{const t=read();subs.forEach(s=>{const v=JSON.stringify(at(t,s.p)??null);if(v!==s.last){s.last=v;s.cb(JSON.parse(v))}})};
  if(bc)bc.onmessage=fire;window.addEventListener("storage",e=>{if(e.key===KEY)fire()});
  return{
    kind:"mock",
    get:async p=>at(read(),p)??null,
    set:async(p,v)=>{const t=read();put(t,p,v);write(t)},
    update:async(p,o)=>{const t=read();Object.entries(o).forEach(([k,v])=>put(t,p+"/"+k,v));write(t)},
    remove:async p=>{const t=read();put(t,p,null);write(t)},
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.push(s);setTimeout(fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  };
}
async function vercelNet(){
  const call=async(op,path,v)=>{const r=await fetch("/api/live",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,path,v})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
  try{const p=await call("ping");if(!p.ok)return null}catch(e){return null}
  return{kind:"vercel",
    get:async p=>(await call("get",p)).v??null,
    set:(p,v)=>call("set",p,v),
    update:(p,o)=>call("update",p,o),
    remove:p=>call("remove",p),
    on:(p,cb)=>{let last,stop=false,t;
      const tick=async()=>{if(stop)return;
        if(!document.hidden){try{const v=(await call("get",p)).v??null,s=JSON.stringify(v);if(s!==last){last=s;cb(v)}}catch(e){}}
        if(!stop)t=setTimeout(tick,1200)};

}

function startFireworks(on){
  const cv=$("#fw");if(!cv)return;const cx=cv.getContext("2d");if(FW)cancelAnimationFrame(FW.raf);
  const dpr=Math.min(2,devicePixelRatio||1);const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr};size();addEventListener("resize",size);
  const COLS=["#C1102F","#E8193C","#FFFFFF","#FFFFFF","#D9D9D9","#C1102F"];
  const rockets=[],parts=[];const t0=performance.now();
  const launch=()=>{const W=cv.width,Hh=cv.height;rockets.push({x:W*(.12+Math.random()*.76),y:Hh,vx:(Math.random()-.5)*1.2*dpr,vy:-(Hh*.0125+Math.random()*Hh*.004),ty:Hh*(.12+Math.random()*.35),c:COLS[Math.floor(Math.random()*COLS.length)]})};
  const burst=(r)=>{const n=70+Math.floor(Math.random()*40),sp=(2.2+Math.random()*2.2)*dpr,ring=Math.random()<.35;
    for(let k=0;k<n;k++){const a=Math.PI*2*k/n+Math.random()*.1,v=ring?sp:sp*(.35+Math.random()*.75);parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.008+Math.random()*.01,c:Math.random()<.25?"#FFFFFF":r.c,s:(1.6+Math.random()*1.4)*dpr})}};
  FW={raf:0};
  const frame=(now)=>{if(!FW)return;const el=now-t0;
    const rate=el<7000?260:el<20000?900:1800;

    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.09*dpr;cx.fillStyle=r.c;cx.beginPath();cx.arc(r.x,r.y,2.2*dpr,0,7);cx.fill();if(r.y<=r.ty||r.vy>=0){burst(r);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.045*dpr;p.life-=p.d;if(p.life<=0){parts.splice(i,1);continue}
      cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()}
    cx.globalAlpha=1;FW.raf=requestAnimationFrame(frame)};

  const d=DEALS[S.di];
  const head=`<div class="rtag" style="text-align:center;margin-top:10px">Deal ${S.di+1} of ${DEALS.length} · ${esc(d.co)} · ${STEPNAME[S.k]}</div>`;
  if(S.k==="price"&&st.sub==="intro"){app.innerHTML=`${head}<div class="box"><h3>${esc(d.co)}</h3><p style="margin:0 0 8px">${esc(d.what)}. Rated <b>${esc(d.rating)}</b>.</p>${termsHTML(d)}</div><div class="wait" style="padding-top:10px"><h2 style="font-size:34px">Read the news on the board</h2><p>Pricing opens in a moment.</p></div>${myLine(st)}`;return}
  if(S.mc)return teamMC(S,st,head);
  return teamForm(S,st,head);
}
function inputHTML(f,v,dis){
  if(f.t==="choice")return `<div class="seg" data-k="${f.k}">${f.opts.map(o=>`<button data-v="${o}" aria-pressed="${v===o}" ${dis?"disabled":""}>${o}</button>`).join("")}</div>`;
  return `<input class="inp big" data-k="${f.k}" inputmode="decimal" autocomplete="off" placeholder="${f.t==="money"?"$0":f.t==="pct"?"0%":"0"}" value="${esc(v||"")}" ${dis?"disabled":""}>`}
function teamForm(S,st,head){
  const M=ME,d=DEALS[S.di],x=d.x,a=ansOf(meP(),S);
  const ctx=S.k==="price"?`<div class="box wide"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(d.co)}</h3>${mktHTML(d)}</div>${termsHTML(d)}</div>${factorHTML(d,st.sub==="reveal")}`
    :`<div class="box wide"><h3>${esc(d.co)}</h3><div class="facts2"><span><small>Issued for</small>${money(x.price)}</span><span><small>${x.call}</small>${money(Math.abs(x.diff))}</span><span><small>Periods</small>${x.n}</span><span><small>Cash interest</small>${money(x.cash)}</span>${x.k?`<span><small>Payments made</small>${x.k}</span>`:""}</div></div>`;
  if(st.sub==="open"&&!(a&&a.lock)){
    if(!M.qStart[S.i])M.qStart[S.i]=Date.now();
    const v=M.draft["s"+S.i]=M.draft["s"+S.i]||{};
    const filled=()=>S.fields.every(f=>f.t==="choice"?!!v[f.k]:!isNaN(num(v[f.k])));
    const draw=()=>{const y=scrollY;
      const form=S.k==="bs"?`<div class="bsx form"><div>Bonds Payable</div><div class="r">${money(d.par)}</div>${S.fields.map(f=>`<div>${esc(f.lbl)}</div><div>${inputHTML(f,v[f.k])}</div>`).join("")}</div>`
        :`<div class="fgrid">${S.fields.map(f=>`<label class="fl ${f.t==="choice"?"wide":""}"><span>${esc(f.lbl)}</span>${inputHTML(f,v[f.k])}</label>`).join("")}</div>`;
      app.innerHTML=`${head}<div class="tbar"><div class="mtext"><span>${STEPNAME[S.k]}</span><span class="timer sm" data-timer>${timerText()}</span></div></div>${ctx}
        <div class="box wide">${S.k==="price"?`<p class="note" style="margin-top:0">Right price: +$300 and a shot at the mandate. Wrong price: −$100.</p>`:S.k==="bs"?`<p class="note" style="margin-top:0">December 31, after ${x.k} interest payments.</p>`:`<p class="note" style="margin-top:0">${S.k==="interest"?"June 30, first interest payment. Straight-line amortization.":`December 31, after ${x.k} interest payments.`}</p>`}${form}</div>
        <div class="lock"><button class="btn main" id="lk" ${filled()?"":"disabled"}>Lock in</button><span class="note">${filled()?"You can't change it after you lock in.":"Fill in every box."}</span></div>`;
      app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{v[b.parentNode.dataset.k]=b.dataset.v;draw()});
      app.querySelectorAll("input[data-k]").forEach(el=>{el.oninput=()=>{v[el.dataset.k]=el.value;const lb=$("#lk");lb.disabled=!filled();lb.nextElementSibling.textContent=filled()?"You can't change it after you lock in.":"Fill in every box."}});
      $("#lk").onclick=async()=>{if(!filled())return;if(!confirm("Lock in your answers?"))return;await save({["s"+S.i]:{v:{...v},lock:true,t:Date.now()-M.qStart[S.i]}});M.key=null;teamRender()};
      scrollTo(0,y)};
    draw();return}
  if(st.sub==="open"){app.innerHTML=`${head}<div class="wait"><h2>Locked in</h2><p>Watch the board.</p></div>${myLine(st)}`;return}
  const g=grade(meP(),S),pts=st.sp?st.sp[M.pid]:g.pts,md=st.md&&st.md[M.pid];
  app.innerHTML=`${head}<div class="verdict ${g.ok?"ok":g.res.some(r=>r.ok)?"mid":"no"}"><h2>${signed(pts||0)}</h2><p>${g.res.filter(r=>r.ok).length} of ${g.res.length} right.${md?` <b>Mandate #${md}: +${money(MANDATE[md-1])}</b>`:""}</p></div>
    <div class="box wide"><table class="t"><thead><tr><th>Item</th><th class="r">Answer</th><th class="r">You said</th><th></th></tr></thead><tbody>
    ${g.res.map(r=>`<tr><td>${esc(r.f.short)}</td><td class="r"><b>${ansTxt(r.f)}</b></td><td class="r">${valTxt(r.f,r.v)}</td><td>${r.ok?`<span class="tag">✓</span>`:`<span class="tag r">✗</span>`}</td></tr>`).join("")}</tbody></table></div>
    <div class="box wide"><h3>How to get it</h3>${workHTML(S)}</div>${S.k==="price"?factorHTML(d,true):""}${myLine(st)}`;
  g.ok?beep(990,.15):beep(220,.3);
}
function teamMC(S,st,head){
  const M=ME,c=S.mc,a=ansOf(meP(),S),mine=a?a.c:null;
  if(st.sub==="open"){
    app.innerHTML=`${head}<div class="box" style="max-width:none"><h3>Entry check</h3><p style="font-size:22px;margin:0">${esc(c.q)}</p></div>
      <div class="opts">${c.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${mine===k}"><span class="sh">${"ABCD"[k]}</span>${jrnRows(o)}</button>`).join("")}</div>
      <p class="note" style="text-align:center">${mine!=null?"Answer saved. You can change it until your teacher reveals it.":`Agree as a team, then tap one. Right answer: +${money(MC_PTS)}.`}</p>`;
    app.querySelectorAll(".opt").forEach(x=>x.onclick=async()=>{await save({["s"+S.i]:{c:+x.dataset.k}});M.key=null;teamRender()});return}
  const ok=mine===c.ans;
  app.innerHTML=`${head}<div class="verdict ${ok?"ok":"no"}"><h2>${ok?"Correct! +"+money(MC_PTS):mine==null?"No answer":"Not quite"}</h2></div>
    <div class="box"><h3>Answer ${"ABCD"[c.ans]}</h3><div class="opt right" style="border-width:2px"><span class="sh">${"ABCD"[c.ans]}</span>${jrnRows(c.opts[c.ans])}</div><p style="margin:10px 0 0">${esc(c.why)}</p></div>${myLine(st)}`;
  ok?beep(990,.15):beep(220,.3);
}
function teamReport(st){
  const M=ME,p=meP(),n=st.sc?Object.keys(st.sc).length:0,tot=st.sc?st.sc[M.pid]:0;
  const miss=[];STEPS.forEach(S=>{const g=grade(p,S);if(S.mc){if(!g.ok)miss.push(`${DEALS[S.di].co}: ${STEPNAME[S.k].toLowerCase()}`)}else g.res.filter(r=>!r.ok).forEach(r=>miss.push(`${DEALS[S.di].co}: ${r.f.short.toLowerCase()} (${ansTxt(r.f)})`))});
  app.innerHTML=`<div class="rep"><h2>${esc(M.name)}: ${money(tot)}</h2><p style="font-size:22px;margin:0">${st.rank?ord(st.rank[M.pid])+" of "+n:""}</p>
    <div class="box" style="max-width:none"><table class="t"><thead><tr><th>Deal</th><th>Call</th><th class="r">Price</th><th class="r">Your price</th></tr></thead><tbody>
    ${DEALS.map(d=>{const S=STEPS.find(s=>s.k==="price"&&s.di===d.i0),g=grade(p,S);return `<tr><td><b>${esc(d.co)}</b></td><td>${d.x.call}</td><td class="r">${money(d.x.price)}</td><td class="r">${g.priceOK?`<span class="tag">✓</span>`:valTxt(S.fields[4],g.res[4].v)}</td></tr>`}).join("")}</tbody></table></div>
    ${miss.length?`<div class="leak"><b>Go back over</b>${miss.map(esc).join(". ")}.</div>`:`<div class="leak okk"><b>Every answer right.</b>Underwriter of the year.</div>`}
    <div class="leak okk"><b>Remember</b>Contract rate sets the cash. Market rate sets the price. n = years × 2, i = market rate ÷ 2.</div></div>`;
  try{localStorage.removeItem(SKEY)}catch(e){}
}
const jrnRows=(rows,h)=>`<span class="jrn">${h?`<span class="h">${esc(h)}</span>`:""}${rows.map(([s,a,v])=>`<span class="${s==="Cr"?"ci":""}">${esc(a)}</span><span class="d">${s==="Dr"?esc(v):""}</span><span class="d">${s==="Cr"?esc(v):""}</span>`).join("")}</span>`;

/* ============================================================ START */
$("#rejoin").onclick=rejoin;
$("#zo").onclick=()=>ROLE==="teacher"?hostZoom(-.1):teamZoom(-.1);$("#zi").onclick=()=>ROLE==="teacher"?hostZoom(.1):teamZoom(.1);
function hostZoom(dz){TZ=Math.min(1.8,Math.max(.6,Math.round((TZ+dz)*10)/10));try{localStorage.setItem("uwTZ",TZ)}catch(e){}zoomApp()}
if(ROLE==="teacher")$("#zm").hidden=false;
ROLE==="teacher"?hostSetup():joinForm();

</script>
</body>
</html>
